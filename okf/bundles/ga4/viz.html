<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OKF Bundle Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  color: #0f172a;
  background: #f8fafc;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: #fff;
  border-bottom: 1px solid #e2e8f0;
  flex-shrink: 0;
}
.title strong { font-size: 16px; margin-right: 8px; }
.muted { color: #64748b; font-size: 12px; }
.controls { display: flex; gap: 8px; }
.controls input, .controls select, .controls button {
  font-size: 13px;
  padding: 5px 8px;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  background: #fff;
}
.controls input { width: 220px; }
.controls button { cursor: pointer; background: #f1f5f9; }
.controls button:hover { background: #e2e8f0; }

main {
  display: flex;
  flex: 1;
  min-height: 0;
}
#graph {
  flex: 1 1 60%;
  background: #fff;
  border-right: 1px solid #e2e8f0;
  min-width: 0;
  position: relative;
}
#detail {
  flex: 0 0 40%;
  overflow-y: auto;
  padding: 18px 22px;
  background: #fff;
}
#detail-empty {
  text-align: center;
  margin-top: 40px;
}

.detail-header { margin-bottom: 12px; }
.detail-header h1 {
  font-size: 18px;
  margin: 4px 0 2px;
  font-weight: 600;
}
.type-chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
dl.frontmatter {
  display: grid;
  grid-template-columns: 90px 1fr;
  row-gap: 4px;
  column-gap: 12px;
  margin: 8px 0 12px;
  font-size: 13px;
}
dl.frontmatter dt {
  color: #64748b;
  font-weight: 500;
}
dl.frontmatter dd { margin: 0; }
dl.frontmatter a { color: #2563eb; word-break: break-all; }

.tag {
  display: inline-block;
  padding: 1px 6px;
  margin: 0 4px 2px 0;
  border-radius: 4px;
  background: #f1f5f9;
  color: #475569;
  font-size: 11px;
}

.badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 8px 0 4px;
}
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  border: 1px solid transparent;
}
.badge.status-stable { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
.badge.status-draft { background: #fefce8; color: #a16207; border-color: #fde68a; }
.badge.status-deprecated { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; text-decoration: line-through; }
.badge.trust-unverified { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; }
.badge.trust-machine-confirmed { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
.badge.trust-human-reviewed { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
.badge.stale { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
.badge.fresh { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }

.sources-list { padding-left: 18px; margin: 0; }
.sources-list li { margin: 1px 0; }

hr { border: none; border-top: 1px solid #e2e8f0; margin: 14px 0; }

#detail-body { font-size: 13px; line-height: 1.55; }
#detail-body h1 {
  font-size: 16px; margin: 18px 0 6px;
  padding-bottom: 4px; border-bottom: 1px solid #e2e8f0;
}
#detail-body h2 { font-size: 14px; margin: 14px 0 4px; }
#detail-body h3 { font-size: 13px; margin: 12px 0 4px; }
#detail-body p { margin: 6px 0; }
#detail-body code {
  background: #f1f5f9;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
}
#detail-body pre {
  background: #0f172a;
  color: #e2e8f0;
  padding: 10px 12px;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 12px;
}
#detail-body pre code { background: transparent; color: inherit; padding: 0; }
#detail-body ul, #detail-body ol { padding-left: 22px; margin: 6px 0; }
#detail-body li { margin: 2px 0; }
#detail-body table { border-collapse: collapse; margin: 8px 0; }
#detail-body th, #detail-body td {
  border: 1px solid #e2e8f0; padding: 4px 8px; font-size: 12px;
}
#detail-body a.internal { color: #2563eb; cursor: pointer; }
#detail-body a.external { color: #2563eb; }

#detail-backlinks { margin-top: 18px; }
#detail-backlinks h2 { font-size: 13px; color: #64748b; margin-bottom: 6px; }
#detail-backlinks ul { padding-left: 18px; }
#detail-backlinks a { color: #2563eb; cursor: pointer; }

</style>
</head>
<body>
<header>
  <div class="title">
    <strong id="bundle-name"></strong>
    <span class="muted">OKF bundle</span>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search title / id / tag">
    <select id="filter-type">
      <option value="">All types</option>
    </select>
    <select id="layout">
      <option value="cose">cose (force)</option>
      <option value="concentric">concentric</option>
      <option value="breadthfirst">breadth-first</option>
      <option value="circle">circle</option>
      <option value="grid">grid</option>
    </select>
    <button id="reset">Reset view</button>
  </div>
</header>

<main>
  <section id="graph"></section>
  <section id="detail">
    <div id="detail-empty" class="muted">Click a node to see its details.</div>
    <article id="detail-content" hidden>
      <header class="detail-header">
        <span class="type-chip" id="detail-type"></span>
        <h1 id="detail-title"></h1>
        <div class="muted" id="detail-id"></div>
      </header>
      <div class="badges" id="detail-badges"></div>
      <dl class="frontmatter">
        <dt>Description</dt><dd id="detail-description"></dd>
        <dt>Resource</dt><dd id="detail-resource"></dd>
        <dt>Tags</dt><dd id="detail-tags"></dd>
        <dt>Generated</dt><dd id="detail-generated"></dd>
        <dt>Verified</dt><dd id="detail-verified"></dd>
        <dt>Sources</dt><dd id="detail-sources"></dd>
      </dl>
      <hr>
      <div id="detail-body"></div>
      <section id="detail-backlinks" hidden>
        <h2>Cited by</h2>
        <ul id="backlinks-list"></ul>
      </section>
    </article>
  </section>
</main>

", "purchasers"], "status": "stable", "generated": {"by": "reference_agent/gemini-3.5-flash", "at": "2026-07-10T21:16:12+00:00"}, "verified": [], "stale_after": "", "sources": [{"id": "sample_queries", "title": "Sample queries for audiences based on BigQuery data - Analytics Help", "resource": "https://support.google.com/analytics/answer/9037342"}], "trust_tier": "unverified", "stale": false, "color": "#10b981", "size": 33}}, {"data": {"id": "tables/events_", "label": "GA4 Events Export", "type": "BigQuery Table", "description": "Google Analytics 4 event-level daily sharded export tables containing user interaction logs.", "resource": "https://bigquery.googleapis.com/v2/projects/bigquery-public-data/datasets/ga4_obfuscated_sample_ecommerce/tables/events_*", "tags": ["analytics", "e-commerce", "ga4", "sharded-tables"], "status": "stable", "generated": {"by": "reference_agent/gemini-3.5-flash", "at": "2026-07-10T21:15:20+00:00"}, "verified": [], "stale_after": "", "sources": [{"title": "Google Analytics Help: BigQuery Export Schema", "id": "ga4-export-docs", "resource": "https://support.google.com/analytics/answer/7029846"}, {"title": "BigQuery Table Metadata", "id": "metadata", "resource": "https://bigquery.googleapis.com/v2/projects/bigquery-public-data/datasets/ga4_obfuscated_sample_ecommerce/tables/events_*"}, {"title": "Sample queries for audiences based on BigQuery data - Analytics Help", "resource": "https://support.google.com/analytics/answer/9037342", "id": "sample_queries"}], "trust_tier": "unverified", "stale": false, "color": "#3b82f6", "size": 76}}], "edges": [{"data": {"id": "datasets/ga4_obfuscated_sample_ecommerce__tables/events_", "source": "datasets/ga4_obfuscated_sample_ecommerce", "target": "tables/events_"}}, {"data": {"id": "tables/events___references/metrics/purchasers", "source": "tables/events_", "target": "references/metrics/purchasers"}}, {"data": {"id": "tables/events___references/metrics/n_day_active_users", "source": "tables/events_", "target": "references/metrics/n_day_active_users"}}, {"data": {"id": "tables/events___references/metrics/n_day_inactive_users", "source": "tables/events_", "target": "references/metrics/n_day_inactive_users"}}, {"data": {"id": "tables/events___references/metrics/frequently_active_users", "source": "tables/events_", "target": "references/metrics/frequently_active_users"}}, {"data": {"id": "tables/events___references/metrics/highly_active_users", "source": "tables/events_", "target": "references/metrics/highly_active_users"}}, {"data": {"id": "tables/events___references/metrics/acquired_users", "source": "tables/events_", "target": "references/metrics/acquired_users"}}, {"data": {"id": "tables/events___references/metrics/google_acquired_cohorts", "source": "tables/events_", "target": "references/metrics/google_acquired_cohorts"}}], "bodies": {"datasets/ga4_obfuscated_sample_ecommerce": "The `ga4_obfuscated_sample_ecommerce` dataset is an obfuscated, publicly accessible export of Google Analytics 4 (GA4) event data representing a real-world web ecommerce implementation (specifically, from the Google Merchandise Store)[^ga4-demo-docs]. It spans three months of historical activity from November 1, 2020, to January 1, 2021[^ga4-demo-docs], and is designed to allow developers, analysts, and students to experiment with high-volume, granular GA4 event data in BigQuery without provisioning a proprietary dataset.\n\nThis dataset contains a single sharded table family, [events_](../tables/events_.md), which holds daily export tables containing individual session interactions, user properties, and ecommerce transaction details. Analysts can leverage this dataset to learn how to query GA4 nested schemas, build user acquisition models, reconstruct user journeys, and analyze purchase funnels.\n\n# Schema\n\nAs a BigQuery Dataset, this resource acts as a namespace containing tables and does not have a flat column schema of its own. It hosts the following tables:\n\n*   [events_](../tables/events_.md): A partitioned, sharded table containing daily Google Analytics 4 event export records.\n\n# Common query patterns\n\n### 1. Count total events and distinct users across the entire dataset\n\nThis query demonstrates how to query over all sharded tables in the dataset using a wildcard suffix pattern.\n\n```sql\nSELECT\n  COUNT(*) AS total_events,\n  COUNT(DISTINCT user_pseudo_id) AS total_users\nFROM\n  `bigquery-public-data.ga4_obfuscated_sample_ecommerce.events_*`\n```\n\n### 2. Locate tables and confirm data availability\n\nThis query retrieves metadata about the individual tables contained within the dataset namespace.\n\n```sql\nSELECT\n  table_id,\n  creation_time,\n  row_count,\n  size_bytes\nFROM\n  `bigquery-public-data.ga4_obfuscated_sample_ecommerce.__TABLES__`\nORDER BY\n  table_id DESC\n```\n\n[^ga4-demo-docs]: [Google Analytics 4 eCommerce Demo Dataset documentation](https://developers.google.com/analytics/bigquery/web-ecommerce-demo-dataset)", "references/metrics/acquired_users": "Builds an audience of Acquired Users, defined as users who were acquired via a specific marketing campaign source, medium, and name.\n\n# Schema\nThis reference describes a query pattern and does not map to a single database schema.\n\n# Common query patterns\n\n```sql\n/**\n * Builds an audience of Acquired Users.\n *\n * Acquired Users = users who were acquired via some Source/Medium/Campaign.\n */\n \nSELECT\n  COUNT(DISTINCT user_id) AS acquired_users_count\nFROM\n  `YOUR_TABLE.events_*`\nWHERE\n  traffic_source.source = 'google'\n  AND traffic_source.medium = 'cpc'\n  AND traffic_source.name = 'VTA-Test-Android'\n  AND _TABLE_SUFFIX BETWEEN '20180521' AND '20240131';\n```\n[^sample_queries]\n\n[^sample_queries]: [Google Analytics Help: Sample queries for audiences based on BigQuery data](https://support.google.com/analytics/answer/9037342)", "references/metrics/frequently_active_users": "Builds an audience of Frequently Active Users, defined as users who have logged at least one event with the event parameter `engagement_time_msec > 0` on N of the last M days, where M > N (for example, on at least 4 of the last 10 days).\n\n# Schema\nThis reference describes a query pattern and does not map to a single database schema.\n\n# Common query patterns\n\n```sql\n/**\n * Builds an audience of Frequently Active Users.\n *\n * Frequently Active Users = users who have logged at least one\n * event with event param engagement_time_msec > 0 on N of \n * the last M days where M > N.\n */\n \nSELECT\n  COUNT(DISTINCT user_id) AS frequent_active_users_count\nFROM\n  (\n    SELECT\n      user_id,\n      COUNT(DISTINCT event_date)\n    FROM\n      `YOUR_TABLE.events_*` AS T\n    CROSS JOIN\n      T.event_params\n    WHERE\n      event_params.key = 'engagement_time_msec' AND event_params.value.int_value > 0\n      -- User engagement in the last M = 10 days.\n      AND event_timestamp >\n          UNIX_MICROS(TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 10 DAY))\n      AND _TABLE_SUFFIX BETWEEN '20180521' AND '20240131'\n    GROUP BY 1\n    -- Having engaged in at least N = 4 days.\n    HAVING COUNT(event_date) >= 4\n  );\n```\n[^sample_queries]\n\n[^sample_queries]: [Google Analytics Help: Sample queries for audiences based on BigQuery data](https://support.google.com/analytics/answer/9037342)", "references/metrics/google_acquired_cohorts": "Builds an audience composed of users acquired last week through Google campaigns (cohorts with specific campaign filters).\n\n# Schema\nThis reference describes a query pattern and does not map to a single database schema.\n\n# Common query patterns\n\n```sql\n/**\n * Builds an audience composed of users acquired last week\n * through Google campaigns, i.e., cohorts with filters.\n *\n * Cohort is defined as users acquired last week, i.e. between 7 - 14\n * days ago. The cohort filter is for users acquired through a direct\n * campaign.\n */\n \nSELECT\n  COUNT(DISTINCT user_id) AS users_acquired_through_google_count\nFROM\n  `YOUR_TABLE.events_*`\nWHERE\n  event_name = 'first_open'\n  -- Cohort: opened app 1-2 weeks ago. One week of cohort, aka. weekly.\n  AND event_timestamp >\n      UNIX_MICROS(TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 14 DAY))\n  AND event_timestamp <\n      UNIX_MICROS(TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 7 DAY))\n  -- Cohort filter: users acquired through 'google' source.\n  AND traffic_source.source = 'google'\n  AND _TABLE_SUFFIX BETWEEN '20180501' AND '20240131';\n```\n[^sample_queries]\n\n[^sample_queries]: [Google Analytics Help: Sample queries for audiences based on BigQuery data](https://support.google.com/analytics/answer/9037342)", "references/metrics/highly_active_users": "Builds an audience of Highly Active Users, defined as users who have been active/engaged for more than N minutes in the last M days, where M > N (for example, more than 0.1 minutes in the last 10 days).\n\n# Schema\nThis reference describes a query pattern and does not map to a single database schema.\n\n# Common query patterns\n\n```sql\n/**\n * Builds an audience of Highly Active Users.\n *\n * Highly Active Users = users who have been active for more than N minutes\n * in the last M days where M > N.\n*/\n\nSELECT\n  COUNT(DISTINCT user_id) AS high_active_users_count\nFROM\n  (\n    SELECT\n      user_id,\n      event_params.key,\n      SUM(event_params.value.int_value)\n    FROM\n      `YOUR_TABLE.events_*` AS T\n    CROSS JOIN\n      T.event_params\n    WHERE\n      -- User engagement in the last M = 10 days.\n      event_timestamp >\n          UNIX_MICROS(TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 10 DAY))\n      AND event_params.key = 'engagement_time_msec'\n      AND _TABLE_SUFFIX BETWEEN '20180521' AND '20240131'\n    GROUP BY 1, 2\n    HAVING\n      -- Having engaged for more than N = 0.1 minutes.\n      SUM(event_params.value.int_value) > 0.1 * 60 * 1000000\n  );\n```\n[^sample_queries]\n\n[^sample_queries]: [Google Analytics Help: Sample queries for audiences based on BigQuery data](https://support.google.com/analytics/answer/9037342)", "references/metrics/n_day_active_users": "Builds an audience of N-Day Active Users, defined as users who have logged at least one event with the event parameter `engagement_time_msec > 0` in the last N days.\n\n# Schema\nThis reference describes a query pattern and does not map to a single database schema.\n\n# Common query patterns\n\n```sql\n/**\n * Builds an audience of N-Day Active Users.\n *\n * N-day active users = users who have logged at least one event with event param \n * engagement_time_msec > 0 in the last N days.\n*/\n\nSELECT\n  COUNT(DISTINCT user_id) AS n_day_active_users_count\nFROM\n  `YOUR_TABLE.events_*` AS T\n    CROSS JOIN\n      T.event_params\nWHERE\n  event_params.key = 'engagement_time_msec' AND event_params.value.int_value > 0\n  -- Pick events in the last N = 20 days.\n  AND event_timestamp >\n      UNIX_MICROS(TIMESTAMP_SUB(CURRENT_TIMESTAMP, INTERVAL 20 DAY))\n  AND _TABLE_SUFFIX BETWEEN '20180521' AND '20240131';\n```\n[^sample_queries]\n\n[^sample_queries]: [Google Analytics Help: Sample queries for audiences based on BigQuery data](https://support.google.com/analytics/answer/9037342)", "references/metrics/n_day_inactive_users": "Builds an audience of N-Day Inactive Users. Inactive users are defined as those active in the last M days (e.g. 7 days) who have NOT logged any event with event parameter `engagement_time_msec > 0` in the last N days (e.g. 2 days), where M > N.\n\n# Schema\nThis reference describes a query pattern and does not map to a single database schema.\n\n# Common query patterns\n\n```sql\n/**\n * Builds an audience of N-Day Inactive Users.\n *\n * N-Day inactive users = users in the last M days who have not logged one  \n * event with event param engagement_time_msec > 0 in the last N days \n *  where M > N.\n */\n \nSELECT\n  COUNT(DISTINCT MDaysUsers.user_id) AS n_day_inactive_users_count\nFROM\n  (\n    SELECT\n      user_id\n    FROM\n      `YOUR_TABLE.events_*` AS T\n    CROSS JOIN\n      T.event_params\n    WHERE\n      event_params.key = 'engagement_time_msec' AND event_params.value.int_value > 0\n      /* Has engaged in last M = 7 days */\n      AND event_timestamp >\n          UNIX_MICROS(TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 7 DAY))\n      AND _TABLE_SUFFIX BETWEEN '20180521' AND '20240131'\n  ) AS MDaysUsers\nLEFT JOIN\n  (\n    SELECT\n      user_id\n    FROM\n      `YOUR_TABLE.events_*` AS T\n    CROSS JOIN\n      T.event_params\n    WHERE\n      event_params.key = 'engagement_time_msec' AND event_params.value.int_value > 0\n      /* Has engaged in last N = 2 days */\n      AND event_timestamp >\n          UNIX_MICROS(TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 2 DAY))\n      AND _TABLE_SUFFIX BETWEEN '20180521' AND '20240131'\n  ) AS NDaysUsers\n  ON MDaysUsers.user_id = NDaysUsers.user_id\nWHERE\n  NDaysUsers.user_id IS NULL;\n```\n[^sample_queries]\n\n[^sample_queries]: [Google Analytics Help: Sample queries for audiences based on BigQuery data](https://support.google.com/analytics/answer/9037342)", "references/metrics/purchasers": "Computes the audience of purchasers, defined as users who have logged either `in_app_purchase` or `purchase`.\n\n# Schema\nThis reference describes a query pattern and does not map to a single database schema.\n\n# Common query patterns\n\n```sql\n/**\n * Computes the audience of purchasers.\n *\n * Purchasers = users who have logged either in_app_purchase or\n * purchase.\n */\n \nSELECT\n  COUNT(DISTINCT user_id) AS purchasers_count\nFROM\n  `YOUR_TABLE.events_*`\nWHERE\n  event_name IN ('in_app_purchase', 'purchase')\n  AND _TABLE_SUFFIX BETWEEN '20180501' AND '20240131';\n```\n[^sample_queries]\n\n[^sample_queries]: [Google Analytics Help: Sample queries for audiences based on BigQuery data](https://support.google.com/analytics/answer/9037342)", "tables/events_": "The `events_` table family contains obfuscated Google Analytics 4 (GA4) event-level export data from the Google Merchandise Store.[^ga4-export-docs] It is structured as a series of daily sharded tables, starting from `events_20201101` through `events_20210131`.[^metadata] Each row represents a single event (e.g., `page_view`, `scroll`, `session_start`, `view_item`, `purchase`) triggered by a user's interaction with the online storefront.\n\nThe data is useful for behavioral analysis, funnel conversion mapping, and e-commerce tracking. Key user attributes such as geographic location, device platform, and acquisition traffic source are nested within top-level records. Additionally, parameters associated with specific events or products are stored in repeated record fields (`event_params` and `items`), requiring flatting or unnesting operations during querying.\n\n# Schema\n\nBelow is the flattened schema representation for the sharded daily events table.\n\n| Field Name | Type | Mode | Description |\n| :--- | :--- | :--- | :--- |\n| **event_date** | STRING | NULLABLE | The date on which the event was logged (formatted as `YYYYMMDD`). |\n| **event_timestamp** | INTEGER | NULLABLE | The POSIX timestamp (in microseconds) when the event was registered. |\n| **event_name** | STRING | NULLABLE | The name of the event (e.g., `page_view`, `purchase`, `session_start`). |\n| **event_params** | RECORD | REPEATED | Key-value parameters associated with the event. |\n| *event_params.key* | STRING | NULLABLE | The name of the parameter. |\n| *event_params.value* | RECORD | NULLABLE | The value of the parameter, nested by data type. |\n| *event_params.value.string_value* | STRING | NULLABLE | Parameter value if it is a string. |\n| *event_params.value.int_value* | INTEGER | NULLABLE | Parameter value if it is an integer. |\n| *event_params.value.float_value* | FLOAT | NULLABLE | Parameter value if it is a float. |\n| *event_params.value.double_value* | FLOAT | NULLABLE | Parameter value if it is a double. |\n| **event_previous_timestamp** | INTEGER | NULLABLE | The timestamp of the previous event (in microseconds). |\n| **event_value_in_usd** | FLOAT | NULLABLE | The monetary value of the event, converted to USD. |\n| **event_bundle_sequence_id** | INTEGER | NULLABLE | The sequence ID of the upload bundle. |\n| **event_server_timestamp_offset** | INTEGER | NULLABLE | Difference between server time and device logging time. |\n| **user_id** | STRING | NULLABLE | The unique identifier of the user (when signed in). |\n| **user_pseudo_id** | STRING | NULLABLE | The pseudonymous consumer device identifier (e.g. GA client ID). |\n| **privacy_info** | RECORD | NULLABLE | Consent and privacy settings. |\n| *privacy_info.analytics_storage* | INTEGER | NULLABLE | Status of analytics storage consent. |\n| *privacy_info.ads_storage* | INTEGER | NULLABLE | Status of ads storage consent. |\n| *privacy_info.uses_transient_token* | STRING | NULLABLE | Whether a transient token is used. |\n| **user_properties** | RECORD | REPEATED | Custom user properties. |\n| *user_properties.key* | INTEGER | NULLABLE | Property name/key. |\n| *user_properties.value* | RECORD | NULLABLE | Nested custom value and update timestamp. |\n| **user_first_touch_timestamp** | INTEGER | NULLABLE | The time (in microseconds) when the user first interacted with the site. |\n| **user_ltv** | RECORD | NULLABLE | User lifetime value details. |\n| *user_ltv.revenue* | FLOAT | NULLABLE | Total revenue attributed to the user over time. |\n| *user_ltv.currency* | STRING | NULLABLE | The currency of the lifetime revenue value. |\n| **device** | RECORD | NULLABLE | Device information of the visitor. |\n| *device.category* | STRING | NULLABLE | Device category (e.g., `mobile`, `desktop`, `tablet`). |\n| *device.mobile_brand_name* | STRING | NULLABLE | Mobile device brand name (e.g., `Apple`, `Samsung`). |\n| *device.mobile_model_name* | STRING | NULLABLE | Mobile model name. |\n| *device.mobile_marketing_name* | STRING | NULLABLE | Device marketing name. |\n| *device.operating_system* | STRING | NULLABLE | Operating system name (e.g., `iOS`, `Android`, `Web`). |\n| *device.operating_system_version* | STRING | NULLABLE | OS version. |\n| *device.language* | STRING | NULLABLE | Browser/device language code. |\n| *device.web_info.browser* | STRING | NULLABLE | Web browser name. |\n| *device.web_info.browser_version* | STRING | NULLABLE | Web browser version. |\n| **geo** | RECORD | NULLABLE | Geographical information derived from IP addresses. |\n| *geo.continent* | STRING | NULLABLE | Continent name. |\n| *geo.sub_continent* | STRING | NULLABLE | Sub-continent name. |\n| *geo.country* | STRING | NULLABLE | Country name. |\n| *geo.region* | STRING | NULLABLE | Region or state name. |\n| *geo.city* | STRING | NULLABLE | City name. |\n| *geo.metro* | STRING | NULLABLE | Metro area name. |\n| **app_info** | RECORD | NULLABLE | Application specific information. |\n| **traffic_source** | RECORD | NULLABLE | User acquisition source. |\n| *traffic_source.medium* | STRING | NULLABLE | The medium (e.g., `organic`, `referral`, `cpc`). |\n| *traffic_source.name* | STRING | NULLABLE | The campaign name. |\n| *traffic_source.source* | STRING | NULLABLE | The source (e.g., `google`, `direct`). |\n| **stream_id** | INTEGER | NULLABLE | Data stream ID. |\n| **platform** | STRING | NULLABLE | The collection platform (e.g., `WEB`, `IOS`, `ANDROID`). |\n| **event_dimensions** | RECORD | NULLABLE | Event-level metadata dimensions. |\n| *event_dimensions.hostname* | STRING | NULLABLE | Target hostname where the event occurred. |\n| **ecommerce** | RECORD | NULLABLE | Order level transaction details. |\n| *ecommerce.total_item_quantity* | INTEGER | NULLABLE | Total items in the transaction. |\n| *ecommerce.purchase_revenue_in_usd* | FLOAT | NULLABLE | Revenue of the transaction converted to USD. |\n| *ecommerce.transaction_id* | STRING | NULLABLE | Transaction identifier. |\n| **items** | RECORD | REPEATED | Product-level attributes for the items involved in the event. |\n| *items.item_id* | STRING | NULLABLE | Product ID or SKU. |\n| *items.item_name* | STRING | NULLABLE | Name of the product. |\n| *items.item_brand* | STRING | NULLABLE | Brand of the product. |\n| *items.price_in_usd* | FLOAT | NULLABLE | Unit price in USD. |\n| *items.quantity* | INTEGER | NULLABLE | Quantity of items. |\n\n# Common query patterns\n\n### 1. Count events and active users by event name\nThis query counts the total events logged and counts distinct users (`user_pseudo_id`) for each event type over the full range of tables.\n\n```sql\nSELECT\n  event_name,\n  COUNT(1) AS event_count,\n  COUNT(DISTINCT user_pseudo_id) AS unique_users\nFROM\n  `bigquery-public-data.ga4_obfuscated_sample_ecommerce.events_*`\nWHERE\n  _TABLE_SUFFIX BETWEEN '20201101' AND '20210131'\nGROUP BY\n  1\nORDER BY\n  event_count DESC;\n```\n\n### 2. Extract nested page_location from event_params\nSince `event_params` is a repeated record (ARRAY), you must unnest it or filter using a subquery to extract a specific parameter like `page_location` for page views.\n\n```sql\nSELECT\n  event_date,\n  (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'page_location') AS page_path,\n  COUNT(1) AS page_views\nFROM\n  `bigquery-public-data.ga4_obfuscated_sample_ecommerce.events_*`\nWHERE\n  event_name = 'page_view'\n  AND _TABLE_SUFFIX BETWEEN '20210101' AND '20210115'\nGROUP BY\n  1, 2\nORDER BY\n  page_views DESC;\n```\n\n### 3. Compute top selling products from items array\nTo analyze product sales, we unnest the repeated `items` record structure on purchase events and aggregate quantities.\n\n```sql\nSELECT\n  item.item_id,\n  item.item_name,\n  SUM(item.quantity) AS units_sold,\n  ROUND(SUM(item.item_revenue_in_usd), 2) AS total_revenue_usd\nFROM\n  `bigquery-public-data.ga4_obfuscated_sample_ecommerce.events_*`,\n  UNNEST(items) AS item\nWHERE\n  event_name = 'purchase'\n  AND _TABLE_SUFFIX BETWEEN '20201101' AND '20210131'\nGROUP BY\n  1, 2\nORDER BY\n  total_revenue_usd DESC\nLIMIT 10;\n```\n\n# Metrics\nThe following predefined and custom audience cohort metrics can be derived from the events log table:\n* [Purchasers](../references/metrics/purchasers.md) \u2014 Users who have logged either `in_app_purchase` or `purchase`.\n* [N-Day Active Users](../references/metrics/n_day_active_users.md) \u2014 Users who have logged at least one event with `engagement_time_msec > 0` in the last N days.\n* [N-Day Inactive Users](../references/metrics/n_day_inactive_users.md) \u2014 Active users from the last M days who have not logged any event with `engagement_time_msec > 0` in the last N days (M > N).\n* [Frequently Active Users](../references/metrics/frequently_active_users.md) \u2014 Users who have logged at least one event with `engagement_time_msec > 0` on N of the last M days.\n* [Highly Active Users](../references/metrics/highly_active_users.md) \u2014 Users who have been active/engaged for more than N minutes in the last M days.\n* [Acquired Users](../references/metrics/acquired_users.md) \u2014 Users acquired via a specific campaign source, medium, and name.\n* [Google Acquired Cohorts](../references/metrics/google_acquired_cohorts.md) \u2014 Users acquired in a specific weekly cohort filtered by Google campaign source.\n\n[^ga4-export-docs]: [Google Analytics Help: BigQuery Export Schema](https://support.google.com/analytics/answer/7029846)\n[^metadata]: Source dataset `ga4_obfuscated_sample_ecommerce` table list metadata."}, "types": ["BigQuery Dataset", "BigQuery Table", "Reference"], "palette": {"BigQuery Dataset": "#8b5cf6", "BigQuery Table": "#3b82f6", "Reference": "#10b981"}};
</script>
<script>
(function () {
  const bundle = window.BUNDLE;
  const bundleName = window.BUNDLE_NAME;
  document.title = `${bundleName} — OKF Viewer`;
  document.getElementById("bundle-name").textContent = bundleName;

  // Populate type filter
  const typeSelect = document.getElementById("filter-type");
  for (const t of bundle.types) {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  }

  // Build reverse-link index for backlinks
  const backlinks = {};
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    (backlinks[target] ||= []).push(source);
  }

  // Look up node label/type by id
  const nodeIndex = {};
  for (const n of bundle.nodes) nodeIndex[n.data.id] = n.data;

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...bundle.nodes, ...bundle.edges],
    style: [
      {
        selector: "node",
        style: {
          "background-color": "data(color)",
          "label": "data(label)",
          "color": "#0f172a",
          "font-size": 11,
          "text-valign": "bottom",
          "text-margin-y": 4,
          "text-wrap": "wrap",
          "text-max-width": 120,
          "width": "data(size)",
          "height": "data(size)",
          "border-width": 1,
          "border-color": "#0f172a",
        },
      },
      {
        selector: "node[?stale]",
        style: {
          "border-width": 2,
          "border-color": "#b91c1c",
          "border-style": "dashed",
        },
      },
      {
        selector: 'node[status = "deprecated"]',
        style: {
          "opacity": 0.55,
        },
      },
      {
        selector: "node:selected",
        style: {
          "border-width": 3,
          "border-color": "#f59e0b",
        },
      },
      {
        selector: "edge",
        style: {
          "width": 1.5,
          "line-color": "#cbd5e1",
          "target-arrow-color": "#cbd5e1",
          "target-arrow-shape": "triangle",
          "curve-style": "bezier",
          "arrow-scale": 0.9,
        },
      },
      {
        selector: "edge:selected",
        style: {
          "line-color": "#f59e0b",
          "target-arrow-color": "#f59e0b",
          "width": 2.5,
        },
      },
      {
        selector: ".dim",
        style: { "opacity": 0.15 },
      },
    ],
    layout: { name: "cose", animate: false, padding: 30 },
    wheelSensitivity: 0.2,
  });

  cy.on("tap", "node", (evt) => showDetail(evt.target.id()));
  cy.on("tap", (evt) => {
    if (evt.target === cy) clearSelection();
  });

  document.getElementById("layout").addEventListener("change", (e) => {
    cy.layout({ name: e.target.value, animate: false, padding: 30 }).run();
  });

  document.getElementById("reset").addEventListener("click", () => {
    cy.fit(null, 30);
    clearSelection();
  });

  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      const d = n.data();
      const hay =
        (d.label || "").toLowerCase() + " " +
        d.id.toLowerCase() + " " +
        (d.tags || []).join(" ").toLowerCase();
      n.toggleClass("dim", !hay.includes(q));
    });
    cy.edges().forEach((edge) => {
      const src = edge.source();
      const tgt = edge.target();
      edge.toggleClass("dim", src.hasClass("dim") || tgt.hasClass("dim"));
    });
  });

  document.getElementById("filter-type").addEventListener("change", (e) => {
    const t = e.target.value;
    if (!t) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      n.toggleClass("dim", n.data("type") !== t);
    });
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
  });

  function clearSelection() {
    cy.elements().unselect();
    document.getElementById("detail-empty").hidden = false;
    document.getElementById("detail-content").hidden = true;
  }

  function showDetail(conceptId) {
    const data = nodeIndex[conceptId];
    if (!data) return;
    cy.elements().unselect();
    const node = cy.getElementById(conceptId);
    if (node) node.select();

    document.getElementById("detail-empty").hidden = true;
    const content = document.getElementById("detail-content");
    content.hidden = false;

    const chip = document.getElementById("detail-type");
    chip.textContent = data.type;
    chip.style.background = data.color;

    document.getElementById("detail-title").textContent = data.label;
    document.getElementById("detail-id").textContent = conceptId;
    document.getElementById("detail-description").textContent = data.description || "—";

    const resourceEl = document.getElementById("detail-resource");
    resourceEl.innerHTML = "";
    if (data.resource) {
      const a = document.createElement("a");
      a.href = data.resource;
      a.textContent = data.resource;
      a.target = "_blank";
      a.rel = "noopener";
      a.className = "external";
      resourceEl.appendChild(a);
    } else {
      resourceEl.textContent = "—";
    }

    const tagsEl = document.getElementById("detail-tags");
    tagsEl.innerHTML = "";
    if (data.tags && data.tags.length) {
      for (const t of data.tags) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = t;
        tagsEl.appendChild(span);
      }
    } else {
      tagsEl.textContent = "—";
    }

    // v0.2 signal badges: status, trust tier, staleness.
    const badgesEl = document.getElementById("detail-badges");
    badgesEl.innerHTML = "";
    const status = data.status || "stable";
    badgesEl.appendChild(makeBadge(status, "status-" + status));
    const tier = data.trust_tier || "unverified";
    badgesEl.appendChild(makeBadge(tier.replace(/-/g, " "), "trust-" + tier));
    if (data.stale) {
      const label = data.stale_after ? `stale (since ${data.stale_after})` : "stale";
      badgesEl.appendChild(makeBadge(label, "stale"));
    } else if (data.stale_after) {
      badgesEl.appendChild(makeBadge(`stale after ${data.stale_after}`, "fresh"));
    }

    document.getElementById("detail-generated").textContent = formatActorEvent(data.generated);

    const verifiedEl = document.getElementById("detail-verified");
    const verified = data.verified || [];
    if (verified.length) {
      verifiedEl.textContent = verified.map(formatActorEvent).join("; ");
    } else {
      verifiedEl.textContent = "—";
    }

    const sourcesEl = document.getElementById("detail-sources");
    sourcesEl.innerHTML = "";
    const sources = data.sources || [];
    if (sources.length) {
      const ul = document.createElement("ul");
      ul.className = "sources-list";
      for (const s of sources) {
        const li = document.createElement("li");
        const label = s.title || s.resource || s.id || "source";
        if (s.resource && /^https?:\/\//.test(s.resource)) {
          const a = document.createElement("a");
          a.href = s.resource;
          a.textContent = label;
          a.target = "_blank";
          a.rel = "noopener";
          a.className = "external";
          li.appendChild(a);
        } else {
          li.textContent = s.resource ? `${label} (${s.resource})` : label;
        }
        ul.appendChild(li);
      }
      sourcesEl.appendChild(ul);
    } else {
      sourcesEl.textContent = "—";
    }

    const body = bundle.bodies[conceptId] || "";
    const html = marked.parse(body, { breaks: false, gfm: true });
    const bodyEl = document.getElementById("detail-body");
    bodyEl.innerHTML = html;
    rewriteInternalLinks(bodyEl);

    const bl = backlinks[conceptId] || [];
    const blSection = document.getElementById("detail-backlinks");
    const blList = document.getElementById("backlinks-list");
    blList.innerHTML = "";
    if (bl.length) {
      blSection.hidden = false;
      for (const src of bl) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = nodeIndex[src]?.label || src;
        a.dataset.target = src;
        a.addEventListener("click", () => showDetail(src));
        li.appendChild(a);
        const muted = document.createElement("span");
        muted.className = "muted";
        muted.textContent = ` (${src})`;
        li.appendChild(muted);
        blList.appendChild(li);
      }
    } else {
      blSection.hidden = true;
    }

    cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.0) }, { duration: 200 });
  }

  function makeBadge(text, cls) {
    const span = document.createElement("span");
    span.className = "badge " + cls;
    span.textContent = text;
    return span;
  }

  function formatActorEvent(event) {
    if (!event || !event.by) return "—";
    return event.at ? `${event.by} · ${event.at}` : String(event.by);
  }

  function rewriteInternalLinks(root) {
    root.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (!href) return;
      if (href.startsWith("/") && href.endsWith(".md")) {
        const target = href.slice(1, -3);
        if (nodeIndex[target]) {
          a.className = "internal";
          a.setAttribute("href", "javascript:void(0)");
          a.addEventListener("click", (e) => {
            e.preventDefault();
            showDetail(target);
          });
          return;
        }
      }
      a.className = "external";
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    });
  }

  // Auto-show the first node (a dataset if available, else first concept)
  const initial =
    bundle.nodes.find((n) => n.data.type === "BigQuery Dataset") ||
    bundle.nodes[0];
  if (initial) showDetail(initial.data.id);
})();

</script>
</body>
</html>
