[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-reference-agent"
version = "0.1.0"
description = "Reference agent that produces Open Knowledge Format bundles"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2",
    "boto3>=1.34",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "markdownify>=0.11",
]

[dependency-groups]
dev = ["pytest>=7.0"]

[project.scripts]
aws-reference-agent = "aws_reference_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aws_reference_agent = ["prompts/*.md", "viewer/templates/*.html", "viewer/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
