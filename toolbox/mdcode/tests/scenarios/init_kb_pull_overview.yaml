name: init_kb_pull_overview
description: A knowledge base pulled right after init holds each document's overview text as its body, since init lists the overview aspect, and a push with no edit keeps its content type.
setup:
  catalog:
    entryGroups:
      - name: projects/t/locations/u/entryGroups/g
    entryTypes:
      - name: projects/dataplex-types/locations/global/entryTypes/generic
    entries:
      - name: projects/t/locations/u/entryGroups/g/entries/doc
        entryType: projects/dataplex-types/locations/global/entryTypes/generic
        aspects:
          dataplex-types.global.overview:
            aspectType: projects/dataplex-types/locations/global/aspectTypes/overview
            data:
              content: The text an author wrote in Knowledge Catalog.
              contentType: HTML

init:
  kb: t.u.g

actions:
  - action: pull
  - action: push
  - action: pull

assert:
  fileSystem:
    catalog/doc.md:
      - contains: "---\nThe text an author wrote in Knowledge Catalog."
      - contains: "contentType: HTML"
