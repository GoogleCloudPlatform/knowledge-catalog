name: pull_bq
description: BigQuery dataset, whose system-written aspects are left out without a warning
setup:
  bigQuery:
    datasets:
      - id: p:d
        datasetReference:
          projectId: p
          datasetId: d
        location: US
    tables:
      - id: p:d.t1
        tableReference:
          projectId: p
          datasetId: d
          tableId: t1
  catalog:
    entryTypes:
      - name: projects/dataplex-types/locations/global/entryTypes/bigquery-dataset
      - name: projects/dataplex-types/locations/global/entryTypes/bigquery-table
    entries:
      - name: projects/p/locations/us/entryGroups/@bigquery/entries/bigquery.googleapis.com/projects/p/datasets/d
        entryType: projects/dataplex-types/locations/global/entryTypes/bigquery-dataset
      - name: projects/p/locations/us/entryGroups/@bigquery/entries/bigquery.googleapis.com/projects/p/datasets/d/tables/t1
        entryType: projects/dataplex-types/locations/global/entryTypes/bigquery-table
        # Aspects BigQuery writes besides the required ones: left out, with
        # no warning.
        aspects:
          dataplex-types.global.usage:
            aspectType: projects/dataplex-types/locations/global/aspectTypes/usage
            data:
              queryCount: 7
          dataplex-types.global.bigquery-policy:
            aspectType: projects/dataplex-types/locations/global/aspectTypes/bigquery-policy
            data: {}

  fileSystem:
    catalog.yaml: |
      scope: bq-dataset.p.d

actions:
  - action: pull

assert:
  fileSystem:
    catalog/p.d.yaml:
      - contains: "name: p.d"
      - contains: "type: dataplex-types.global.bigquery-dataset"
    catalog/p.d/t1.yaml:
      - contains: "name: p.d/t1"
      - contains: "type: dataplex-types.global.bigquery-table"
      - notContains: "queryCount"
  warnings: []
