# The analytical binding profile: every logical field maps to a differently
# named physical column. Keys and join columns are physical columns, so the
# profile declares its own primary keys and `placed_by` join columns, and the
# generated DDL carries them at every structural site (node KEY, edge SOURCE
# KEY / DESTINATION KEY / REFERENCES). Each MEASURE operand reads the field's
# column. `segment` is explicitly unbound, which prunes it and the
# segment_count metric.
name: analytical
entities:
  - name: Customer
    source: bigquery.googleapis.com/projects/acme/datasets/sales/tables/customers
    primary_key: [cust_id]
    fields:
      - { name: id, expression: cust_id }
      - { name: name, expression: full_name }
    fields_exclude: [segment]
  - name: Order
    source: bigquery.googleapis.com/projects/acme/datasets/sales/tables/orders
    primary_key: [order_id]
    fields:
      - { name: id, expression: order_id }
      - { name: customerId, expression: fk_customer }
      - { name: amount, expression: gross_amount }
metrics_exclude: [segment_count]
relationships:
  - name: placed_by
    from_columns: [fk_customer]
    to_columns: [cust_id]
