version: 0.2.0.dev0/google
semantic_model:
  - name: sales
    deployment_target: //bigquery.googleapis.com/projects/demo/datasets/sales/propertyGraphs/sales_graph
    entities:
      - name: orders
        source: demo.sales.orders
        primary_key:
          - o_orderkey
        fields:
          - name: o_orderkey
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: o_orderkey
          - name: o_totalprice
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: o_totalprice
    metrics:
      - name: total_revenue
        expression:
          dialects:
            - dialect: BIGQUERY
              expression: SUM(orders.o_totalprice)
