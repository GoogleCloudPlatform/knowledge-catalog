version: 0.2.0.dev0/google
semantic_model:
  - name: school_graph
    description: Students, courses, and the enrollments that pair them
    entities:
      - name: students
        source: sqlgen-testing.bei_semantic_ir_verify.students
        primary_key:
          - student_id
        fields:
          - name: student_id
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: students.student_id
          - name: name
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: students.name
      - name: courses
        source: sqlgen-testing.bei_semantic_ir_verify.courses
        primary_key:
          - course_id
        fields:
          - name: course_id
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: courses.course_id
          - name: title
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: courses.title
    relationships:
      - name: enrollment
        from: students
        to: courses
        through: sqlgen-testing.bei_semantic_ir_verify.enrollment
        keys:
          - enrollment_id
        from_columns:
          - student_id
        to_columns:
          - course_id
        fields:
          - name: grade
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: enrollment.grade
            description: Letter grade
