# Test fixture -- AI-first semantics format (v0.2.0.dev0/google).
#
# A minimal star (orders -> customer) plus a model-level ACTION, the write-side
# counterpart to a metric, and the CONSTRAINTS that gate it. PlaceOrder carries
# an MCP executor (a tool in Agent Registry) and ontology-typed parameters: an
# entity-typed one (`customer`, an object reference to the customer entity) and
# scalar ones. The model also names a BigQuery deployment target, so a push
# exercises the leg that deploys neither an action nor a constraint.
#
# The five constraints cover every validation path. NonNegativeOrderTotal names
# a KNOWN entity, so its field is checked; every qualified token in an
# expression is, wherever it appears. PositiveQuantity names `OrderedAs`, which
# is no entity, so it is left to the evaluator rather than falsely rejected.
# RequestedQuantityIsPositive reads the action's `quantity` parameter, so
# PlaceOrder names it in `guards`. LargeOrderIsJustified states a `judgment`
# rather than an expression, so the goldens carry the derived `evaluation:
# judged` and the required `on_violation` beside it. OrderWithinStandingLimit
# and LargeOrderIsJustified are the two that state routing words, so the goldens
# show `on_violation` and `severity` making the round trip while the other three
# show their absence.
#
# PlaceOrder's `affects` covers every authored shape at once: an entry on an
# entity narrowed to the fields it writes, an entry on a relationship, and the
# bare-name shorthand -- `customer` is touched in a way the model does not spell
# out. The first two show that one vocabulary covers both kinds: creating the
# edge to the customer is a `create`, the same verb as creating the order. The
# OSI golden shows the normalization: the first two keep their record, the
# third stays a bare name.
#
# PositiveQuantity and RequestedQuantityIsPositive are one business rule in its
# two bindings. The invariant holds over stored order lines, whatever wrote
# them. The guard holds over the argument a caller passed, and can be checked
# only before the call runs, which is why a guard has to be named by the action
# and an invariant does not.
#
# The constraints also cover both annotation shapes, which land in different
# places.
# NonNegativeOrderTotal declares a full `ai_context` beside its description --
# instructions, synonyms and examples -- so the catalog golden shows the
# description on the entry source and the whole `ai_context` on the aspect.
# PositiveQuantity declares a description alone.

version: "0.2.0.dev0/google"

semantic_model:
  - name: sales
    description: Sales orders with customer attributes
    deployment_target: //bigquery.googleapis.com/projects/sqlgen-testing/datasets/demo/propertyGraphs/sales
    entities:
      - name: orders
        source: samples.tpch.orders
        primary_key: [o_orderkey]
        fields:
          - name: o_orderkey
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: o_orderkey
          - name: o_custkey
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: o_custkey
          - name: o_totalprice
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: o_totalprice
      - name: customer
        source: samples.tpch.customer
        primary_key: [c_custkey]
        fields:
          - name: c_custkey
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: c_custkey
          - name: c_name
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: c_name
    relationships:
      - name: orders_to_customer
        from: orders
        to: customer
        from_columns: [o_custkey]
        to_columns: [c_custkey]
    metrics:
      - name: total_revenue
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(orders.o_totalprice)
        description: Total order revenue
    actions:
      - name: PlaceOrder
        description: Create an order for a customer
        executor:
          mcp:
            server: //agentregistry.googleapis.com/projects/acme-ops/locations/us-central1/mcpServers/commerce
            tool: place_order
        parameters:
          - {name: customer, type: customer}
          - {name: quantity, type: Integer}
        guards: [RequestedQuantityIsPositive]
        affects:
          - concept: orders
            operation: create
            fields: [o_orderkey, o_totalprice]
          - concept: orders_to_customer
            operation: create
          - customer
        ai_context:
          instructions: "Resolve the buyer to a customer before calling."
    constraints:
      - name: NonNegativeOrderTotal
        expression: orders.o_totalprice >= 0
        description: >-
          An order's total cannot be negative. Reduce the quantity or check the
          unit price before retrying.
        ai_context:
          instructions: >-
            Quote the shortfall in the customer's own currency when refusing.
          synonyms: [NoNegativeTotals, NonNegativeTotal]
          examples: ["Why was my order rejected?"]
      - name: PositiveQuantity
        expression: OrderedAs.quantity > 0
        description: An order line must be for at least one unit.
      - name: OrderWithinStandingLimit
        expression: orders.o_totalprice <= 100000
        description: >-
          An order this large is above the standing limit and needs a sales
          manager to sign off. Ask for approval, or split the order.
        on_violation: escalate
        severity: high
      - name: RequestedQuantityIsPositive
        expression: quantity > 0
        description: >-
          A request must be for at least one unit. Ask the caller for the
          quantity again before retrying.
      - name: LargeOrderIsJustified
        judgment: >-
          An order whose orders.o_totalprice is far above what this customer
          usually places must be explained by something in the request itself,
          such as a stated event or a contract reference. A round number alone
          is not an explanation.
        description: >-
          Say what makes this order larger than usual, then resubmit for
          approval.
        on_violation: escalate
        severity: medium
