# Simulated query rows for shop.yaml (the data-profile golden tests).
#
# One row per query, under the id of the FIRST statement that query settles
# (several statements share a query; see the [id] lines of
# shop.profile.golden.sql). Cells are as BigQuery returns them: a string, or
# null; JSON columns hold the JSON text.
#
# The rows are chosen so every status shows up for a reason a reader can
# check by hand: a unique key with repeats, orphaned foreign keys, a
# one-to-one edge reached twice (the invoices keep every revision), values
# outside a declared set, a field three orders of magnitude below its unit
# peers, a declared and an undeclared scale break, and a required field
# with nulls.

