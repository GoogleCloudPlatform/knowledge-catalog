# (no warnings)
version: 0.2.0.dev0
semantic_model:
  - name: sales
    custom_extensions:
      - vendor_name: GOOGLE
        data: '{"deploymentTargets":["//bigquery.googleapis.com/projects/demo/datasets/sales/propertyGraphs/sales_graph"]}'
    datasets:
      - name: orders
        source: demo.sales.orders
        fields:
          - name: o_orderkey
            datatype: Opaque
          - name: o_totalprice
            datatype: Opaque
    metrics:
      - name: total_revenue
