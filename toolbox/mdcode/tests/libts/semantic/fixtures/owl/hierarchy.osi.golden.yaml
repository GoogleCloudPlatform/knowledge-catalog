version: 0.2.0.dev0/google
semantic_model:
  - name: hierarchy
    description: Imported from OWL ontology http://example.com/hr#
    entities:
      - name: Person
        abstract: true
        description: A human being.
        fields:
          - name: fullName
            datatype: String
      - name: Employee
        abstract: true
        description: A person employed by the organization.
        fields:
          - name: employeeId
            datatype: String
          - name: legalName
            datatype: String
      - name: Customer
        extends:
          - Person
        description: A person who buys.
        fields:
          - name: loyaltyTier
            datatype: String
      - name: Manager
        extends:
          - Person
          - Employee
        description: An employee who manages others.
    relationships:
      - name: managedBy
        from: Employee
        to: Manager
        extends:
          - worksWith
        abstract: true
      - name: worksWith
        from: Employee
        to: Employee
        abstract: true
    constraints:
      - name: Manager_employeeId_required
        judgment: Every Manager has a value for Manager.employeeId. A Manager whose
          Manager.employeeId is null or missing does not satisfy this rule.
        description: "Set Manager.employeeId on every Manager. (From OWL: Manager
          SubClassOf employeeId min 1.)"
        on_violation: warn
