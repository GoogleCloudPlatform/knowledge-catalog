version: 0.2.0.dev0/google
semantic_model:
  - name: hierarchy
    description: Imported from OWL ontology http://example.com/hr#
    entities:
      - name: Person
        description: A human being.
        fields:
          - name: fullName
            datatype: String
      - name: Employee
        description: A person employed by the organization.
        fields:
          - name: employeeId
            datatype: String
          - name: legalName
            datatype: String
      - name: Customer
        extends:
          - Person
        description: A person who buys.
        fields:
          - name: loyaltyTier
            datatype: String
      - name: Manager
        extends:
          - Person
          - Employee
        description: An employee who manages others.
    relationships:
      - name: managedBy
        from: Employee
        to: Manager
      - name: worksWith
        from: Employee
        to: Employee
