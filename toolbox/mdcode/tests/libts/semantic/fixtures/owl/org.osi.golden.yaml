version: 0.2.0.dev0
semantic_model:
  - name: org
    description: "An org chart: employees, the departments they work in, and the
      projects they staff."
    datasets:
      - name: Employee
        source: unbound:Employee
        primary_key:
          - employeeId
        description: A person employed by the organization.
        ai_context:
          synonyms:
            - Staff member
            - Worker
        fields:
          - name: employeeId
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: employeeId
            datatype: String
            description: The employee's unique staff number.
          - name: fullName
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: fullName
            datatype: String
            label: name
          - name: hireDate
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: hireDate
            datatype: Date
            dimension:
              is_time: true
          - name: salary
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: salary
            datatype: Decimal
          - name: fteRatio
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: fteRatio
            datatype: Float
          - name: level
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: level
            datatype: Integer
          - name: isManager
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: isManager
            datatype: Boolean
          - name: lastLogin
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: lastLogin
            datatype: DateTime
            dimension:
              is_time: true
          - name: startDate
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: startDate
            datatype: Date
            dimension:
              is_time: true
      - name: Department
        source: unbound:Department
        primary_key:
          - deptCode
        description: A functional unit that employees belong to.
        ai_context:
          synonyms:
            - Org unit
        fields:
          - name: deptCode
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: deptCode
            datatype: String
          - name: budget
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: budget
            datatype: Decimal
      - name: Project
        source: unbound:Project
        primary_key:
          - portfolio
          - projectNo
        description: A body of work staffed by employees.
        fields:
          - name: portfolio
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: portfolio
            datatype: String
          - name: projectNo
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: projectNo
            datatype: Integer
          - name: startDate
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: startDate
            datatype: Date
            dimension:
              is_time: true
          - name: notes
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: notes
            datatype: Opaque
    relationships:
      - name: worksIn
        from: Employee
        to: Department
        from_columns:
          - TODO_BIND
        to_columns:
          - deptCode
        ai_context:
          instructions: The department an employee belongs to.
          synonyms:
            - member of
      - name: reportsTo
        from: Employee
        to: Employee
        from_columns:
          - TODO_BIND
        to_columns:
          - employeeId
        ai_context:
          instructions: The manager an employee reports to.
      - name: worksOn
        from: Employee
        to: Project
        from_columns:
          - TODO_BIND
          - TODO_BIND
        to_columns:
          - portfolio
          - projectNo
