version: 0.2.0.dev0/google
semantic_model:
  - name: deals
    description: Imported from OWL ontology http://example.com/deals#
    entities:
      - name: Party
        members:
          - code: acme
            iri: http://example.com/deals#acme
          - code: globex
            iri: http://example.com/deals#globex
        fields:
          - name: name
            datatype: String
      - name: Opportunity
        abstract: true
        fields:
          - name: amount
            datatype: Opaque
      - name: Contract
      - name: WonOpportunity
        extends:
          - Opportunity
        abstract: true
        ai_context:
          instructions: "Membership is defined, not stored: a WonOpportunity is
            Opportunity and (governedBy some Contract). No WonOpportunity rows
            or nodes exist; to find its members, evaluate this definition over
            Opportunity and its relationships."
    relationships:
      - name: hasBuyer
        from: Opportunity
        to: Party
      - name: governedBy
        from: Opportunity
        to: Contract
    constraints:
      - name: WonOpportunity_governedBy_some_Contract
        judgment: Each WonOpportunity has at least one governedBy relationship to a
          Contract. A WonOpportunity with no governedBy relationship to a
          Contract does not satisfy this rule.
        description: "Link each WonOpportunity to at least one Contract through
          governedBy. (From OWL: WonOpportunity EquivalentTo Opportunity and
          (governedBy some Contract).)"
        on_violation: warn
