# (no warnings)
version: 0.2.0.dev0/google
semantic_model:
  - name: sales
    description: Sales orders with customer attributes
    deployment_target: //bigquery.googleapis.com/projects/sqlgen-testing/datasets/demo/propertyGraphs/sales
    entities:
      - name: orders
        source: samples.tpch.orders
        primary_key:
          - o_orderkey
        fields:
          - name: o_orderkey
            datatype: Opaque
          - name: o_custkey
            datatype: Opaque
          - name: o_totalprice
            datatype: Opaque
      - name: customer
        source: samples.tpch.customer
        primary_key:
          - c_custkey
        fields:
          - name: c_custkey
            datatype: Opaque
          - name: c_name
            datatype: Opaque
    relationships:
      - name: orders-to-customer
        from: orders
        to: customer
        from_columns:
          - o_custkey
        to_columns:
          - c_custkey
    metrics:
      - name: total_revenue
        description: Total order revenue
    actions:
      - name: PlaceOrder
        description: Create an order for a customer
        executor:
          mcp:
            server: //agentregistry.googleapis.com/projects/acme-ops/locations/us-central1/mcpServers/commerce
            tool: place_order
        parameters:
          - name: customer
            type: customer
          - name: quantity
            type: Integer
        guards:
          - OrderWithinCustomerCredit
        affects:
          - concept: orders
            operation: create
            fields:
              - o_orderkey
              - o_totalprice
          - concept: orders_to_customer
            operation: create
          - customer
        ai_context:
          instructions: Resolve the buyer to a customer before calling.
    constraints:
      - name: NonNegativeOrderTotal
        judgment: The resulting orders.o_totalprice must not be negative.
        description: An order's total cannot be negative. Reduce the quantity or check
          the unit price before retrying.
        on_violation: reject
        ai_context:
          instructions: Quote the shortfall in the customer's own currency when refusing.
          synonyms:
            - NoNegativeTotals
            - NonNegativeTotal
          examples:
            - Why was my order rejected?
      - name: PositiveQuantity
        judgment: Every OrderedAs.quantity on the order must be at least one.
        description: An order line must be for at least one unit.
        on_violation: reject
      - name: OrderWithinStandingLimit
        judgment: orders.o_totalprice must not exceed 100000, which is the standing
          limit a sales manager signs off above. Read it as an amount of money.
        description: An order this large is above the standing limit and needs a sales
          manager to sign off. Ask for approval, or split the order.
        on_violation: escalate
        severity: high
      - name: OrderWithinCustomerCredit
        judgment: The resulting orders.o_totalprice must not exceed the credit this
          customer has on record. That figure is not stated in the arguments, so
          read it before answering.
        description: An order cannot exceed the credit on record for this customer.
          Lower the quantity, or ask for a credit review.
        on_violation: reject
      - name: LargeOrderIsJustified
        judgment: An order whose orders.o_totalprice is far above what this customer
          usually places must be explained by something in the request itself,
          such as a stated event or a contract reference. A round number alone
          is not an explanation.
        description: Say what makes this order larger than usual, then resubmit for
          approval.
        on_violation: escalate
        severity: medium
