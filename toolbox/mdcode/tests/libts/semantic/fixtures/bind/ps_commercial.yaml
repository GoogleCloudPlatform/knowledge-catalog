          - name: signalDate
            datatype: Date
            dimension:
              is_time: true
            description: When the signal was observed.
      - name: IndustryForecast
        extends:
          - MarketIntelligenceRecord
        primary_key:
          - forecastId
        description: An external forecast of the total addressable market and
          cloud-migration spend for a market vertical in a year, attributed to a
          market unit and service group.
        ai_context:
          synonyms:
            - Market forecast
