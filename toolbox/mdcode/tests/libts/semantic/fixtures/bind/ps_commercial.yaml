        primary_key:
          - asOfDate
          - forecastCategory
          - marketUnitCode
          - serviceGroupCode
        description: "Pipeline value and probability-weighted pipeline value recorded on
          a date for a forecast category, market unit and service group: the
          history of the pipeline, which current opportunity records do not
          keep. One snapshot per (as-of date, forecast category, market unit,
          service group); a few snapshots record no market unit or no service
          group."
        ai_context:
          synonyms:
            - Pipeline history
            - Forecast snapshot
        fields:
          - name: marketUnitCode
            datatype: String
            description: "Identifier of a market unit (pattern MUD-G-nnnnn). On the market
              unit it is the key; on a client account, opportunity, sales
              target, pipeline snapshot, industry forecast, WBS element, revenue
              posting or booking it references the market unit the record
              belongs to, as recorded: usually the code, sometimes the unit's
              name (see unitName)."
          - name: serviceGroupCode
            datatype: String
            description: "Identifier of a service group (pattern SGD-G-nnnnn). On the
              service group it is the key; on an opportunity, sales credit,
              sales target, pipeline snapshot, industry forecast or revenue
              posting it references the service group the record is attributed
              to, as recorded: usually the code, sometimes the group's name (see
              unitName)."
          - name: asOfDate
            datatype: Date
            dimension:
              is_time: true
            description: Date the pipeline was measured.
          - name: forecastCategory
            datatype: String
            description: "Forecast category of the measured pipeline: commit, best_case or
