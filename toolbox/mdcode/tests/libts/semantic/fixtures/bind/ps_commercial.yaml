            description: Whether the licence allows the record to be used with generative AI
              ('Yes' / 'No'). Records marked 'No' must not be passed to
              generative AI.
          - name: syntheticProxy
            datatype: String
            description: Whether the record is a synthetic stand-in for licensed data
              ('true' / 'false').
      - name: IntentSignal
