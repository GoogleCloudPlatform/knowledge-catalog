      - name: ContractAgreement
        extends:
          - Agreement
        primary_key:
          - contractNumber
        description: A signed or in-flight agreement with a client that governs an
          opportunity's delivery.
        ai_context:
          synonyms:
            - Contract
        fields:
          - name: accountId
            datatype: String
            description: Identifier of a client account (pattern CA-G-nnnnn). On the client
              account it is the key; on an opportunity (buyer), key buyer,
              stakeholder, partner alliance, health scorecard, intent signal,
              contract agreement (payer) or engagement (client delivered for) it
              references the client account.
          - name: opportunityId
            datatype: String
            description: Identifier of an opportunity (pattern OPP-G-nnnnn; records migrated
              from an older CRM use OPP-yyyy-nnnnn). On the opportunity it is
              the key; on a stage transition, sales credit, pricing case,
              pricing dispute, WBS element, contract agreement or engagement it
              references the opportunity the record belongs to.
          - name: contractNumber
            datatype: String
            description: Identifier of a contract agreement. On the agreement it is the key;
              on a change order, obligation or engagement it references the
              agreement amended, owing the obligation or executed.
          - name: contractName
            datatype: String
            description: Name of the contract.
          - name: contractType
            datatype: String
            description: MSA, SOW, Subcontract or Amendment.
          - name: contractStatus
            datatype: String
            label: contract status code
            description: "Status name as recorded; references a ContractStatus by its code
              (the edge hasStatus). Must be one of the canonical ContractStatus
              codes: differently-cased spellings match their status
              case-insensitively and are reported by the shapes."
          - name: contractStartDate
            datatype: Date
            dimension:
              is_time: true
            description: When the contract term starts.
          - name: contractEndDate
            datatype: Date
            dimension:
              is_time: true
            description: When the contract term ends.
          - name: governingLaw
            datatype: String
            description: Jurisdiction whose law governs the contract.
          - name: liabilityCapUsd
            datatype: Decimal
            unit: USD
            label: liability cap
            description: Contractual liability cap, USD.
          - name: totalCommittedValue
            datatype: Decimal
            unit: USD
            description: Value committed under the contract, USD.
      - name: MasterServicesAgreement
        extends:
          - ContractAgreement
        defined:
          expression: contractType = 'MSA'
        description: Umbrella agreement setting the terms that later statements of work
          inherit.
        ai_context:
          synonyms:
            - MSA
      - name: StatementOfWork
        extends:
          - ContractAgreement
        defined:
          expression: contractType = 'SOW'
        description: Agreement defining the scope, deliverables and price of a specific
          piece of work.
        ai_context:
          synonyms:
            - SOW
      - name: Subcontract
        extends:
          - ContractAgreement
        defined:
          expression: contractType = 'Subcontract'
        description: Agreement under which a third party performs part of the work.
      - name: Amendment
        extends:
          - ContractAgreement
        defined:
          expression: contractType = 'Amendment'
        description: Agreement that modifies the terms of an existing agreement.
      - name: ContractStatus
        extends:
          - BusinessObject
        primary_key:
          - statusCode
        members:
          - code: Draft
            label: Draft
            order: 1
            iri: https://example.org/ontology/contract#Status_Draft
          - code: Under Review
            label: Under review
            order: 2
            iri: https://example.org/ontology/contract#Status_UnderReview
          - code: Signed
            label: Signed
            order: 3
            iri: https://example.org/ontology/contract#Status_Signed
          - code: Active
            label: Active
            order: 4
            iri: https://example.org/ontology/contract#Status_Active
          - code: Expired
            label: Expired
            order: 5
            iri: https://example.org/ontology/contract#Status_Expired
          - code: Terminated
            label: Terminated
            order: 6
            iri: https://example.org/ontology/contract#Status_Terminated
        description: Lifecycle status of a contract agreement.
        fields:
          - name: statusCode
            datatype: String
            description: Canonical contract status name.
      - name: ChangeOrder
        extends:
          - CommercialDocument
        primary_key:
          - changeOrderId
        description: A change to a contract's value, scope or effort.
        ai_context:
          synonyms:
            - Contract change notice
            - CCN
        fields:
          - name: contractNumber
            datatype: String
            description: Identifier of a contract agreement. On the agreement it is the key;
              on a change order, obligation or engagement it references the
              agreement amended, owing the obligation or executed.
          - name: changeOrderId
            datatype: String
            description: Identifier of a change order.
          - name: ccnNumber
            datatype: String
            description: "Number of the contract change notice (CCN) under which the change
              order was issued, as recorded. Not an identifier: many change
              orders share a CCN number; use changeOrderId."
            ai_context:
              synonyms:
                - contract change notice number
          - name: changeType
            datatype: String
            description: Kind of change (scope, schedule, price...).
          - name: changeStatus
            datatype: String
            description: Proposed, Approved, Executed or Rejected.
          - name: effectiveDate
            datatype: Date
            dimension:
              is_time: true
            description: When the change takes effect.
          - name: valueDeltaUsd
            datatype: Decimal
            unit: USD
            label: value delta
            description: Change in contract value, USD.
          - name: hoursDelta
            datatype: Decimal
            description: Change in contracted effort, hours.
      - name: ContractObligation
        extends:
          - BusinessObject
