version: 0.2.0.dev0/google
semantic_model:
  - name: ps_commercial
    description: "Upper ontology shared by the commercial, finance, contract and
      delivery modules: parties, organizational units, commercial documents, and
      the generic counterparty and territory relationships. (ontology version
      1.0.0)"
    ai_context:
      synonyms:
        - Professional services core ontology
    entities:
      - name: BusinessObject
        abstract: true
        description: Any identifiable thing the enterprise records and reasons about.
      - name: Party
        extends:
          - BusinessObject
        abstract: true
        description: "A person or organization that takes part in business: clients,
          partners, buyers, sellers, practitioners."
        fields:
          - name: partyName
            datatype: String
            description: "Display name of a party: an organization's legal / trading name or
              a person's full name."
      - name: Organization
        extends:
          - Party
        abstract: true
        description: A legal or commercial organization.
      - name: Person
        extends:
          - Party
        abstract: true
        description: An individual human.
      - name: OrgUnit
        extends:
          - BusinessObject
        abstract: true
        unique_keys:
          - - unitName
        description: "A unit the enterprise uses to organize sales and delivery:
          territories and service lines."
        ai_context:
          synonyms:
            - Organizational unit
        fields:
          - name: unitName
            datatype: String
            description: "Display name of an organizational unit. Business rule: no two
              units share a name (owl:InverseFunctionalProperty), so the name is
              a unique key of the unit besides its code. Several source systems
              record a market unit or service group by name instead of by code;
              such a reference resolves to the unit through this key. The source
              unit masters do hold a few names shared by several units; those
              names identify no unit, are reported by validation, and do not
              resolve."
      - name: MarketUnit
        extends:
          - OrgUnit
        primary_key:
          - marketUnitCode
        unique_keys:
          - - unitName
        description: A sales territory that rolls up into a geographic region.
        ai_context:
          synonyms:
            - Territory
            - Sales territory
        fields:
          - name: marketUnitCode
            datatype: String
            description: "Identifier of a market unit (pattern MUD-G-nnnnn). On the market
              unit it is the key; on a client account, opportunity, sales
              target, pipeline snapshot, industry forecast, WBS element, revenue
              posting or booking it references the market unit the record
              belongs to, as recorded: usually the code, sometimes the unit's
              name (see unitName)."
          - name: currencyCode
            datatype: String
            description: ISO 4217 currency of the market unit's local ledger.
          - name: geographicRegion
            datatype: String
            label: geographic region code
            description: Code of the geographic region the market unit rolls up into, as
              recorded; must be one of the GeographicRegion codes (NA, EMEA,
              APAC).
      - name: GeographicRegion
        primary_key:
          - regionCode
        members:
          - code: NA
            label: North America
            order: 1
            iri: https://example.org/ontology/core#Region_NA
          - code: EMEA
            label: Europe, Middle East & Africa
            order: 2
            iri: https://example.org/ontology/core#Region_EMEA
          - code: APAC
            label: Asia Pacific
            order: 3
            iri: https://example.org/ontology/core#Region_APAC
        description: "Top-level geographic region a market unit rolls up into. A closed
          vocabulary: the regions are the named individuals below (the ontology
          is their system of record; market units record the region's code)."
        ai_context:
          synonyms:
            - Region
            - Geography
        fields:
          - name: regionCode
            datatype: String
            description: Canonical code of a geographic region (NA, EMEA, APAC).
      - name: ServiceGroup
        extends:
          - OrgUnit
        primary_key:
          - serviceGroupCode
        unique_keys:
          - - unitName
        description: An offering / practice line that sells and delivers a family of
          services.
        ai_context:
          synonyms:
            - Service line
            - Practice
        fields:
          - name: serviceGroupCode
            datatype: String
            description: "Identifier of a service group (pattern SGD-G-nnnnn). On the
              service group it is the key; on an opportunity, sales credit,
              sales target, pipeline snapshot, industry forecast or revenue
              posting it references the service group the record is attributed
              to, as recorded: usually the code, sometimes the group's name (see
              unitName)."
          - name: deliveryArchetype
            datatype: String
            description: How the service group typically delivers (e.g. consulting, managed
              services).
          - name: primaryPracticeLead
            datatype: String
            description: Name of the service group's primary practice lead, as recorded (a
              name, not a link to an employee record).
      - name: CommercialDocument
        extends:
          - BusinessObject
        abstract: true
        description: "A record of a commercial commitment or proposal with a
          counterparty: opportunities, pricing cases, agreements, change
          orders."
      - name: Agreement
        extends:
          - CommercialDocument
        abstract: true
        description: A commercial document that binds the parties once signed.
      - name: ClientAccount
        extends:
          - Organization
        primary_key:
          - accountId
        description: An organization that buys services. The authoritative client
          master; the finance module's Counterparty is the same concept.
        ai_context:
          synonyms:
            - Client
            - Customer
            - Account
            - Counterparty
            - Payer
            - Bill-to party
        fields:
          - name: marketUnitCode
            datatype: String
            description: "Identifier of a market unit (pattern MUD-G-nnnnn). On the market
              unit it is the key; on a client account, opportunity, sales
              target, pipeline snapshot, industry forecast, WBS element, revenue
              posting or booking it references the market unit the record
              belongs to, as recorded: usually the code, sometimes the unit's
              name (see unitName)."
          - name: accountId
            datatype: String
            description: Identifier of a client account (pattern CA-G-nnnnn). On the client
              account it is the key; on an opportunity (buyer), key buyer,
              stakeholder, partner alliance, health scorecard, intent signal,
              contract agreement (payer) or engagement (client delivered for) it
              references the client account.
          - name: industryVertical
            datatype: String
            description: Industry the client operates in.
          - name: accountTier
            datatype: String
            description: "Coverage tier: Diamond, Tier 1 Global, Tier 2 Regional, Tier 3
              Growth."
          - name: accountCreatedAt
            datatype: DateTime
            dimension:
              is_time: true
            description: When the client account was created.
      - name: EcosystemPartner
        extends:
          - Organization
        primary_key:
          - partnerName
        description: A technology or platform vendor the enterprise partners with to win
          and deliver work.
        ai_context:
          synonyms:
            - Alliance partner
            - Technology partner
        fields:
          - name: partnerName
            datatype: String
            description: Name of an ecosystem partner. On the partner it is the key; on a
              partner alliance it names the partner the alliance is with.
      - name: KeyBuyer
        extends:
          - Person
        primary_key:
          - buyerId
        description: A named decision maker at a client account.
        ai_context:
          synonyms:
            - Decision maker
            - Buyer contact
        fields:
          - name: accountId
            datatype: String
            description: Identifier of a client account (pattern CA-G-nnnnn). On the client
              account it is the key; on an opportunity (buyer), key buyer,
              stakeholder, partner alliance, health scorecard, intent signal,
              contract agreement (payer) or engagement (client delivered for) it
              references the client account.
          - name: buyerId
            datatype: String
            description: Identifier of a key buyer.
          - name: buyerSeniority
            datatype: String
            description: Seniority of the buyer (e.g. C-suite).
          - name: disposition
            datatype: String
            description: The buyer's disposition toward the enterprise.
          - name: influenceScore
            datatype: Decimal
            description: How much the buyer influences purchase decisions, on a 1-10 scale.
      - name: ClientStakeholder
        extends:
          - Person
        primary_key:
          - stakeholderId
        description: A person mapped on a client account's relationship matrix, with
          their stance toward the enterprise.
        fields:
          - name: accountId
            datatype: String
            description: Identifier of a client account (pattern CA-G-nnnnn). On the client
              account it is the key; on an opportunity (buyer), key buyer,
              stakeholder, partner alliance, health scorecard, intent signal,
              contract agreement (payer) or engagement (client delivered for) it
              references the client account.
          - name: stakeholderId
            datatype: String
            description: Identifier of a client stakeholder.
          - name: relationshipStance
            datatype: String
            description: Champion, Supporter, Neutral, Skeptic or Hostile.
          - name: influenceLevel
            datatype: String
            description: Influence of the stakeholder on decisions.
          - name: seniorityLevel
            datatype: String
            description: "Seniority or role of the stakeholder in the client organization:
              C-Suite, VP, Director, Program Manager or Procurement Lead."
          - name: lastInteractionDate
            datatype: Date
            dimension:
              is_time: true
            description: Date of the most recent recorded interaction with the stakeholder.
      - name: SalesTeamMember
        extends:
          - Person
        primary_key:
          - salesTeamMemberId
        unique_keys:
          - - corporateEmail
        description: A seller who originates, leads or is credited on opportunities; can
          also lead delivery engagements.
        ai_context:
          synonyms:
            - Seller
            - Originator
        fields:
          - name: homeMarketUnit
            datatype: String
            description: "The market unit a seller or employee belongs to, as recorded:
              usually the market unit code, sometimes the unit's name (see
              unitName). References a market unit."
          - name: salesTeamMemberId
            datatype: String
            description: Identifier of a seller (pattern STM-G-nnnnn). On the seller it is
              the key; on a sales credit or sales target it references the
              seller credited or targeted.
          - name: corporateEmail
            datatype: String
            description: "The seller's corporate email address. Business rule: no two
              sellers share a corporate email (owl:InverseFunctionalProperty,
              published as a uniqueness constraint and reported by validation).
              It is a data-quality rule, not an identifier: the CRM holds
              duplicate addresses, so sellers are identified and joined only by
              salesTeamMemberId."
          - name: practitionerLevel
            datatype: String
            description: Career level of the seller.
      - name: Opportunity
        extends:
          - CommercialDocument
        primary_key:
          - opportunityId
        description: A potential sale to a client account, tracked from identification
          to won or lost.
        ai_context:
          synonyms:
            - Deal
            - Pursuit
            - Sales opportunity
        fields:
          - name: marketUnitCode
            datatype: String
            description: "Identifier of a market unit (pattern MUD-G-nnnnn). On the market
              unit it is the key; on a client account, opportunity, sales
              target, pipeline snapshot, industry forecast, WBS element, revenue
              posting or booking it references the market unit the record
              belongs to, as recorded: usually the code, sometimes the unit's
              name (see unitName)."
          - name: serviceGroupCode
            datatype: String
            description: "Identifier of a service group (pattern SGD-G-nnnnn). On the
              service group it is the key; on an opportunity, sales credit,
              sales target, pipeline snapshot, industry forecast or revenue
              posting it references the service group the record is attributed
              to, as recorded: usually the code, sometimes the group's name (see
              unitName)."
          - name: accountId
            datatype: String
            description: Identifier of a client account (pattern CA-G-nnnnn). On the client
              account it is the key; on an opportunity (buyer), key buyer,
              stakeholder, partner alliance, health scorecard, intent signal,
              contract agreement (payer) or engagement (client delivered for) it
              references the client account.
          - name: opportunityId
            datatype: String
            description: Identifier of an opportunity (pattern OPP-G-nnnnn; records migrated
              from an older CRM use OPP-yyyy-nnnnn). On the opportunity it is
              the key; on a stage transition, sales credit, pricing case,
              pricing dispute, WBS element, contract agreement or engagement it
              references the opportunity the record belongs to.
          - name: originatorId
            datatype: String
            label: lead originator ID
            description: Sales team member ID of the seller who originated the opportunity.
              References a sales team member.
          - name: opportunityName
            datatype: String
            description: Name of the opportunity.
          - name: salesStage
            datatype: String
            label: sales stage code
            description: "Code of the opportunity's current sales stage as recorded in the
              CRM; references a SalesStage by its code (the edge inStage). Must
              be one of the canonical SalesStage codes: the CRM mixes casings
              (e.g. '5_WON' for '5_won'), which match their stage
              case-insensitively and are reported by the shapes."
          - name: totalContractValue
            datatype: Decimal
            unit: USD
            description: Total value of the contract over its full term, USD.
            ai_context:
              synonyms:
                - TCV
          - name: annualContractValue
            datatype: Decimal
            unit: USD
            description: Contract value per year, USD.
            ai_context:
              synonyms:
                - ACV
          - name: wonAmount
            datatype: Decimal
            unit: USD
            description: Amount credited as sold when the opportunity is won, USD.
            ai_context:
              synonyms:
                - sales
          - name: probabilityOfWin
            datatype: Decimal
            description: Estimated probability (0-1) that the opportunity is won.
            ai_context:
              synonyms:
                - PWIN
                - win probability
          - name: constructType
            datatype: String
            description: Commercial construct the opportunity is being sold on.
          - name: closeDate
            datatype: Date
            dimension:
              is_time: true
            description: Expected or actual close date (ISO 8601).
          - name: createdAt
            datatype: DateTime
            dimension:
              is_time: true
            description: When the opportunity was created.
      - name: SalesStage
        extends:
          - BusinessObject
        primary_key:
          - stageCode
        members:
          - code: 0A
            label: Identified
            order: 1
            iri: https://example.org/ontology/commercial#Stage_0A
          - code: 0B
            label: Qualifying
            order: 2
            iri: https://example.org/ontology/commercial#Stage_0B
          - code: "1"
            label: Qualified
            order: 3
            iri: https://example.org/ontology/commercial#Stage_1
          - code: 2A
            label: Solutioning
            order: 4
            iri: https://example.org/ontology/commercial#Stage_2A
          - code: 2B
            label: Proposal
            order: 5
            iri: https://example.org/ontology/commercial#Stage_2B
          - code: "3"
            label: Shortlisted
            order: 6
            iri: https://example.org/ontology/commercial#Stage_3
          - code: "4"
            label: Negotiation
            order: 7
            iri: https://example.org/ontology/commercial#Stage_4
          - code: 5_won
            label: Won
            order: 8
            iri: https://example.org/ontology/commercial#Stage_Won
          - code: closed_lost
            label: Lost
            order: 9
            iri: https://example.org/ontology/commercial#Stage_Lost
        description: A step of the opportunity lifecycle. The canonical codes are the
          named individuals below; any other spelling in the data is a quality
          defect.
        fields:
          - name: stageCode
            datatype: String
            description: Canonical code of a sales stage.
          - name: stageLabel
            datatype: String
            description: Business name of a sales stage.
          - name: stageOrder
            datatype: Integer
            description: Position of the stage in the lifecycle.
      - name: WonOpportunity
        extends:
          - ClosedOpportunity
        defined:
          expression: LOWER(salesStage) = '5_won'
        description: An opportunity in the Won stage.
      - name: LostOpportunity
        extends:
          - ClosedOpportunity
        defined:
          expression: LOWER(salesStage) = 'closed_lost'
        description: An opportunity in the Lost stage.
      - name: ClosedOpportunity
        extends:
          - Opportunity
        defined:
          expression: LOWER(salesStage) = '5_won' OR LOWER(salesStage) = 'closed_lost'
        description: An opportunity that has been won or lost.
      - name: ActivePipeline
        extends:
          - Opportunity
        defined:
          expression: NOT (LOWER(salesStage) = '5_won' OR LOWER(salesStage) =
            'closed_lost')
        description: An opportunity that is not closed (neither won nor lost).
        ai_context:
          synonyms:
            - Open opportunity
            - Open pipeline
      - name: HighValueOpportunity
        extends:
          - Opportunity
        defined:
          expression: totalContractValue >= 1000
        description: An opportunity whose total contract value is at least USD 1,000.
      - name: MegaDeal
        extends:
          - HighValueOpportunity
        defined:
          expression: totalContractValue >= 20000
        description: An opportunity whose total contract value is at least USD 20,000;
          requires executive deal review.
      - name: StrategicAccount
        extends:
          - ClientAccount
        defined:
          expression: accountTier IN ('Diamond', 'Tier 1 Global')
        description: A client account in the Diamond or Tier 1 Global tier.
      - name: PriorityOpportunity
        extends:
          - Opportunity
        description: An opportunity that is high value, or whose buyer is a strategic
          account.
      - name: StageTransition
        extends:
          - BusinessObject
        primary_key:
          - stageHistoryId
        description: An opportunity entering a sales stage, with the time spent in it.
        fields:
          - name: opportunityId
            datatype: String
            description: Identifier of an opportunity (pattern OPP-G-nnnnn; records migrated
              from an older CRM use OPP-yyyy-nnnnn). On the opportunity it is
              the key; on a stage transition, sales credit, pricing case,
              pricing dispute, WBS element, contract agreement or engagement it
              references the opportunity the record belongs to.
          - name: stageHistoryId
            datatype: String
            description: Identifier of a stage transition.
          - name: stageName
            datatype: String
            label: stage entered
            description: Code of the stage that was entered.
          - name: stageEnteredDate
            datatype: DateTime
            dimension:
              is_time: true
            description: When the stage was entered.
          - name: daysInStage
            datatype: Integer
            description: Days the opportunity spent in the stage.
          - name: transitionedBy
            datatype: String
            description: Who moved the opportunity into the stage, as recorded in the CRM (a
              user name, not a link to a seller or employee record).
      - name: SalesCredit
        extends:
          - BusinessObject
        primary_key:
          - roleAssignmentId
        description: A seller's role and credit allocation on an opportunity.
        ai_context:
          synonyms:
            - Sales role assignment
        fields:
          - name: serviceGroupCode
            datatype: String
            description: "Identifier of a service group (pattern SGD-G-nnnnn). On the
              service group it is the key; on an opportunity, sales credit,
              sales target, pipeline snapshot, industry forecast or revenue
              posting it references the service group the record is attributed
              to, as recorded: usually the code, sometimes the group's name (see
              unitName)."
          - name: salesTeamMemberId
            datatype: String
            description: Identifier of a seller (pattern STM-G-nnnnn). On the seller it is
              the key; on a sales credit or sales target it references the
              seller credited or targeted.
          - name: opportunityId
            datatype: String
            description: Identifier of an opportunity (pattern OPP-G-nnnnn; records migrated
              from an older CRM use OPP-yyyy-nnnnn). On the opportunity it is
              the key; on a stage transition, sales credit, pricing case,
              pricing dispute, WBS element, contract agreement or engagement it
              references the opportunity the record belongs to.
          - name: roleAssignmentId
            datatype: String
            description: Identifier of a sales credit.
          - name: roleName
            datatype: String
            label: sales role
            description: Lead Originator, Sales Co-Originator, Solution Lead, Commercial
              Architect or Advisory Partner.
          - name: roleAllocationPct
            datatype: Decimal
            label: role allocation %
            description: Share of the opportunity credited to this role.
      - name: DealPricing
        extends:
          - CommercialDocument
        primary_key:
          - pricingId
        description: "The priced proposal for an opportunity: target and floor price,
          approved discount and commercial construct."
        ai_context:
          synonyms:
            - Pricing case
            - Price proposal
        fields:
          - name: opportunityId
            datatype: String
            description: Identifier of an opportunity (pattern OPP-G-nnnnn; records migrated
              from an older CRM use OPP-yyyy-nnnnn). On the opportunity it is
              the key; on a stage transition, sales credit, pricing case,
              pricing dispute, WBS element, contract agreement or engagement it
              references the opportunity the record belongs to.
          - name: pricingId
            datatype: String
            description: Identifier of a pricing case. On the pricing case it is the key; on
              a rate card line it references the pricing case the line belongs
              to.
          - name: targetPrice
            datatype: Decimal
            unit: USD
            description: Price the deal team aims for, USD.
          - name: floorPrice
            datatype: Decimal
            unit: USD
            description: Lowest price allowed without an exception, USD.
          - name: approvedDiscountPct
            datatype: Decimal
            label: approved discount %
            description: Discount approved against the standard price.
          - name: pricingConstruct
            datatype: String
            label: pricing construct code
            description: "Name of the pricing construct as recorded; references a
              PricingConstruct by its code (the edge pricedOn). Must be one of
              the canonical PricingConstruct codes: differently-cased spellings
              match their construct case-insensitively and are reported by the
              shapes."
          - name: pricingStatus
            datatype: String
            description: Approval status of the pricing case.
          - name: pricingCreatedAt
            datatype: DateTime
            dimension:
              is_time: true
            description: When the pricing case was created.
      - name: PricingConstruct
        extends:
          - BusinessObject
        primary_key:
          - constructCode
        members:
          - code: Fixed Price Milestone
            label: Fixed price (milestone)
            order: 1
            iri: https://example.org/ontology/commercial#Construct_FixedPriceMilestone
          - code: Managed Services Annuity
            label: Managed services annuity
            order: 2
            iri: https://example.org/ontology/commercial#Construct_ManagedServicesAnnuity
          - code: Time and Materials
            label: Time and materials
            order: 3
            iri: https://example.org/ontology/commercial#Construct_TimeAndMaterials
          - code: Gainshare Outcome
            label: Gainshare / outcome based
            order: 4
            iri: https://example.org/ontology/commercial#Construct_GainshareOutcome
        description: The commercial model a deal is priced on.
        ai_context:
          synonyms:
            - Commercial model
        fields:
          - name: constructCode
            datatype: String
            description: Canonical name of a pricing construct.
      - name: RateCardLine
        extends:
          - BusinessObject
        primary_key:
          - rateLineId
        description: A role / country line of a pricing case with its average daily rate.
        fields:
          - name: pricingId
            datatype: String
            description: Identifier of a pricing case. On the pricing case it is the key; on
              a rate card line it references the pricing case the line belongs
              to.
          - name: rateLineId
            datatype: String
            description: Identifier of a rate card line. On the line it is the key; on a
              price adjustment it references the line whose rate is adjusted.
          - name: roleLevel
            datatype: String
            description: Career level priced on the line.
          - name: country
            datatype: String
            description: Delivery country of the line.
          - name: averageDailyRate
            datatype: Decimal
            description: Average price per person-day on the line, USD. The line's
              billingUnit records whether the rate was quoted hourly or per
              8-hour day.
            ai_context:
              synonyms:
                - ADR
          - name: hoursAssumed
            datatype: Decimal
            description: Hours assumed on the line.
          - name: billingUnit
            datatype: String
            description: "Unit the line's rate is quoted in: Hourly Rate or Daily 8h Rate,
              as recorded."
      - name: PricingDispute
        extends:
          - BusinessObject
        primary_key:
          - disputeId
        description: An escalation raised because a deal's price breaches policy (e.g.
          below floor).
        ai_context:
          synonyms:
            - Pricing escalation
        fields:
          - name: opportunityId
            datatype: String
            description: Identifier of an opportunity (pattern OPP-G-nnnnn; records migrated
              from an older CRM use OPP-yyyy-nnnnn). On the opportunity it is
              the key; on a stage transition, sales credit, pricing case,
              pricing dispute, WBS element, contract agreement or engagement it
              references the opportunity the record belongs to.
          - name: disputeId
            datatype: String
            description: Identifier of a pricing dispute.
          - name: disputeStatus
            datatype: String
            description: Open, Under Escalation, Hurdle Waived, Restructured or Declined.
          - name: escalationTier
            datatype: String
            description: Management level the dispute is escalated to.
          - name: loggedAt
            datatype: DateTime
            dimension:
              is_time: true
            description: When the dispute was raised.
          - name: resolvedAt
            datatype: DateTime
            dimension:
              is_time: true
            description: When the dispute was resolved, as recorded. Must not precede
              loggedAt (reported by the pricing dispute shape).
      - name: PartnerAlliance
        extends:
          - BusinessObject
        primary_key:
          - allianceId
        description: A joint go-to-market relationship between a client account and an
          ecosystem partner.
        fields:
          - name: accountId
            datatype: String
            description: Identifier of a client account (pattern CA-G-nnnnn). On the client
              account it is the key; on an opportunity (buyer), key buyer,
              stakeholder, partner alliance, health scorecard, intent signal,
              contract agreement (payer) or engagement (client delivered for) it
              references the client account.
          - name: partnerName
            datatype: String
            description: Name of an ecosystem partner. On the partner it is the key; on a
              partner alliance it names the partner the alliance is with.
          - name: allianceId
            datatype: String
            description: Identifier of a partner alliance.
          - name: partnerTier
            datatype: String
            description: "Tier of the alliance: Global Strategic, Premier, Certified,
              Niche."
          - name: jointPipelineUsd
            datatype: Decimal
            unit: USD
            label: joint pipeline
            description: Pipeline pursued jointly with the partner, USD.
          - name: allianceRevenueInfluence
            datatype: Decimal
            description: Revenue influenced by the alliance, as recorded on the alliance.
          - name: subcontractorUsed
            datatype: String
            description: Whether the partner is used as a subcontractor on the alliance
              ('true' / 'false').
      - name: ClientHealthScorecard
        extends:
          - BusinessObject
        primary_key:
          - scorecardId
        description: A periodic survey of a client's satisfaction and relationship health.
        ai_context:
          synonyms:
            - NPS survey
            - Client satisfaction survey
        fields:
          - name: accountId
            datatype: String
            description: Identifier of a client account (pattern CA-G-nnnnn). On the client
