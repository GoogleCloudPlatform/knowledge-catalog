            datatype: String
            description: Identifier of a client account (pattern CA-G-nnnnn). On the client
              account it is the key; on an opportunity (buyer), key buyer,
              stakeholder, partner alliance, health scorecard, intent signal,
              contract agreement (payer) or engagement (client delivered for) it
