          - name: assignmentEndDate
            datatype: Date
            dimension:
              is_time: true
            description: When the assignment ends.
          - name: allocationPct
            datatype: Decimal
            label: allocation %
            description: Share of the employee's time allocated.
          - name: scheduledHours
            datatype: Decimal
            description: Hours scheduled over the assignment.
      - name: TimesheetEntry
        extends:
          - BusinessObject
        primary_key:
          - timesheetId
        description: Hours an employee recorded against a staffing assignment on a day.
        fields:
          - name: engagementId
            datatype: String
            description: Identifier of an engagement. On the engagement it is the key; on a
              milestone, QA health check, staffing assignment or timesheet entry
              it references the engagement the record belongs to.
          - name: employeeId
            datatype: String
            description: Identifier of an employee (pattern EP-G-nnnnn). On the employee it
              is the key; on a staffing assignment or timesheet entry it
              references the employee assigned or recording.
          - name: assignmentId
            datatype: String
            description: Identifier of a staffing assignment. On the assignment it is the
              key; on a timesheet entry it references the assignment the hours
              are recorded against.
          - name: timesheetId
            datatype: String
            description: Identifier of a timesheet entry.
          - name: workDate
            datatype: Date
            dimension:
              is_time: true
            description: Day the hours were worked.
          - name: entryStatus
            datatype: String
            description: Submitted, Pending Review or Approved.
          - name: billableHours
            datatype: Decimal
            description: Hours chargeable to the client.
            ai_context:
              synonyms:
                - chargeable hours
          - name: nonBillableHours
            datatype: Decimal
            description: Hours not chargeable to the client.
          - name: overtimeHours
            datatype: Decimal
            description: Hours beyond the standard day.
      - name: WBSElement
        extends:
          - BusinessObject
        primary_key:
          - wbsElementCode
        description: A financial work-breakdown-structure element set up when an
          opportunity is won; revenue, cost and bookings post against it.
        ai_context:
          synonyms:
            - Charge code
            - Contract financials
        fields:
          - name: marketUnitCode
            datatype: String
            description: "Identifier of a market unit (pattern MUD-G-nnnnn). On the market
              unit it is the key; on a client account, opportunity, sales
              target, pipeline snapshot, industry forecast, WBS element, revenue
              posting or booking it references the market unit the record
              belongs to, as recorded: usually the code, sometimes the unit's
              name (see unitName)."
          - name: opportunityId
            datatype: String
            description: Identifier of an opportunity (pattern OPP-G-nnnnn; records migrated
              from an older CRM use OPP-yyyy-nnnnn). On the opportunity it is
              the key; on a stage transition, sales credit, pricing case,
              pricing dispute, WBS element, contract agreement or engagement it
              references the opportunity the record belongs to.
          - name: wbsElementCode
            datatype: String
            label: WBS element
            description: Code of the WBS element. On the WBS element it is the key; on a
              revenue posting or booking it references the WBS element posted or
              booked on.
          - name: companyCode
            datatype: String
            description: Ledger company code.
          - name: legalEntity
            datatype: String
            description: Contracting legal entity.
          - name: recognitionMethod
            datatype: String
            description: "Revenue recognition method: Milestone Completion, As Incurred T&M,
              Ratable Straight Line, Percentage of Completion EAC."
          - name: contractValueUsd
            datatype: Decimal
            unit: USD
            label: contract value
            description: Contract value set up in finance, USD.
          - name: setupDate
            datatype: Date
            dimension:
              is_time: true
            description: When the WBS element was created.
      - name: RevenueActual
        extends:
          - BusinessObject
        primary_key:
          - revenueEntryId
        description: Revenue recognized and cost incurred on a WBS element in a period.
        ai_context:
          synonyms:
            - Recognized revenue
        fields:
          - name: marketUnitCode
            datatype: String
            description: "Identifier of a market unit (pattern MUD-G-nnnnn). On the market
              unit it is the key; on a client account, opportunity, sales
              target, pipeline snapshot, industry forecast, WBS element, revenue
              posting or booking it references the market unit the record
              belongs to, as recorded: usually the code, sometimes the unit's
              name (see unitName)."
          - name: serviceGroupCode
            datatype: String
            description: "Identifier of a service group (pattern SGD-G-nnnnn). On the
              service group it is the key; on an opportunity, sales credit,
              sales target, pipeline snapshot, industry forecast or revenue
              posting it references the service group the record is attributed
              to, as recorded: usually the code, sometimes the group's name (see
              unitName)."
          - name: wbsElementCode
            datatype: String
            label: WBS element
            description: Code of the WBS element. On the WBS element it is the key; on a
              revenue posting or booking it references the WBS element posted or
              booked on.
          - name: revenueEntryId
            datatype: String
            description: Identifier of a revenue posting.
          - name: servicesRevenue
            datatype: Decimal
            unit: USD
            description: Revenue from services delivered, USD.
          - name: allianceUtilizationRevenue
            datatype: Decimal
            unit: USD
            label: alliance revenue
            description: Revenue from resold partner products, USD.
          - name: softwareMiscRevenue
            datatype: Decimal
            unit: USD
            label: software and other revenue
            description: Software and miscellaneous revenue, USD.
          - name: costToServe
            datatype: Decimal
            unit: USD
            description: Cost incurred to deliver, USD.
          - name: recognizedPeriod
            datatype: String
            description: Fiscal period the revenue is recognized in.
      - name: Booking
        extends:
          - BusinessObject
        primary_key:
          - bookingId
        description: The amount booked on a WBS element when the contract is signed.
        fields:
          - name: marketUnitCode
            datatype: String
            description: "Identifier of a market unit (pattern MUD-G-nnnnn). On the market
              unit it is the key; on a client account, opportunity, sales
              target, pipeline snapshot, industry forecast, WBS element, revenue
              posting or booking it references the market unit the record
              belongs to, as recorded: usually the code, sometimes the unit's
              name (see unitName)."
          - name: wbsElementCode
            datatype: String
            label: WBS element
            description: Code of the WBS element. On the WBS element it is the key; on a
              revenue posting or booking it references the WBS element posted or
              booked on.
          - name: bookingId
            datatype: String
            description: Identifier of a booking.
          - name: bookedAmount
            datatype: Decimal
            unit: USD
            description: Won amount at the sign date, USD.
          - name: signDate
            datatype: Date
            dimension:
              is_time: true
            description: When the contract was signed.
          - name: authorizedBy
            datatype: String
            description: Who authorized the booking.
    relationships:
      - name: hasCounterparty
        from: CommercialDocument
        to: Organization
        abstract: true
        ai_context:
          instructions: Links a commercial document to an organization on the other side
            of it. Specialized by the buyer of an opportunity and the payer of a
            contract; querying this property returns every counterparty
            relationship, whatever the domain calls it.
      - name: belongsToTerritory
        from: BusinessObject
        to: OrgUnit
        abstract: true
        ai_context:
          instructions: >-
            Places a business object in a territory. Transitive: an opportunity
            in a market unit that belongs to a region also belongs to that
            region.


            belongsToTerritory is transitive: if a belongsToTerritory b and b
            belongsToTerritory c, then a belongsToTerritory c, but only the
            direct edges are stored. To follow it, match a quantified path, e.g.
            MATCH (a:BusinessObject)-[:belongsToTerritory]->{1,10}(b:OrgUnit)
            (raise the upper bound for deeper chains).
      - name: inRegion
        from: MarketUnit
        to: GeographicRegion
        extends:
          - belongsToTerritory
        from_columns:
          - geographicRegion
        to_columns:
          - regionCode
        ai_context:
          instructions: The geographic region a market unit rolls up into.
      - name: relatedParty
        from: Party
        to: Party
        abstract: true
        ai_context:
          instructions: >-
            Any business relationship between two parties. Symmetric: if A is
            related to B then B is related to A.


            relatedParty is symmetric: a relatedParty b implies b relatedParty
            a, but each pair may be stored in one direction only. Match it
            undirected, e.g. MATCH (a:Party)-[:relatedParty]-(b:Party).
      - name: inStage
        from: Opportunity
        to: SalesStage
        from_columns:
          - salesStage
        to_columns:
          - stageCode
        ai_context:
          instructions: The current sales stage of an opportunity.
      - name: pricedOn
        from: DealPricing
        to: PricingConstruct
        from_columns:
          - pricingConstruct
        to_columns:
          - constructCode
        ai_context:
          instructions: The pricing construct of a deal pricing case.
      - name: hasBuyer
        from: Opportunity
        to: ClientAccount
        extends:
          - hasCounterparty
        inverse: hasOpportunity
        from_columns:
          - accountId
        to_columns:
          - accountId
        ai_context:
          instructions: The client account buying an opportunity.
          synonyms:
            - buyer
            - client of
      - name: bookedIn
        from: Opportunity
        to: MarketUnit
        extends:
          - belongsToTerritory
        from_columns:
          - marketUnitCode
        to_columns:
          - marketUnitCode
        ai_context:
          instructions: The market unit an opportunity is booked in.
      - name: soldBy
        from: Opportunity
        to: ServiceGroup
        from_columns:
          - serviceGroupCode
        to_columns:
          - serviceGroupCode
        ai_context:
          instructions: The service group selling an opportunity.
      - name: originatedBy
        from: Opportunity
        to: SalesTeamMember
        from_columns:
          - originatorId
        to_columns:
          - salesTeamMemberId
        ai_context:
          instructions: The seller who originated an opportunity.
          synonyms:
            - lead originator
      - name: managedIn
        from: ClientAccount
        to: MarketUnit
        extends:
          - belongsToTerritory
        from_columns:
          - marketUnitCode
        to_columns:
          - marketUnitCode
        ai_context:
          instructions: The market unit that manages a client account.
      - name: buyerAt
        from: KeyBuyer
        to: ClientAccount
        from_columns:
          - accountId
        to_columns:
          - accountId
        ai_context:
          instructions: The client account a key buyer works for.
      - name: stakeholderAt
        from: ClientStakeholder
        to: ClientAccount
        from_columns:
          - accountId
        to_columns:
          - accountId
        ai_context:
          instructions: The client account a stakeholder belongs to.
      - name: sellerHomeMarket
        from: SalesTeamMember
        to: MarketUnit
        extends:
          - belongsToTerritory
        from_columns:
          - homeMarketUnit
        to_columns:
          - marketUnitCode
        ai_context:
          instructions: The home market unit of a seller.
      - name: transitionOf
        from: StageTransition
        to: Opportunity
        from_columns:
          - opportunityId
        to_columns:
          - opportunityId
        ai_context:
          instructions: The opportunity a stage transition belongs to.
      - name: creditedOn
        from: SalesCredit
        to: Opportunity
        from_columns:
          - opportunityId
        to_columns:
          - opportunityId
        ai_context:
          instructions: The opportunity a sales credit is on.
      - name: creditedTo
        from: SalesCredit
        to: SalesTeamMember
        from_columns:
          - salesTeamMemberId
        to_columns:
          - salesTeamMemberId
        ai_context:
          instructions: The seller who receives a sales credit.
      - name: creditedServiceGroup
        from: SalesCredit
        to: ServiceGroup
        from_columns:
          - serviceGroupCode
        to_columns:
          - serviceGroupCode
        ai_context:
          instructions: The service group a sales credit is attributed to, as recorded on
            the credit.
      - name: prices
        from: DealPricing
        to: Opportunity
        from_columns:
          - opportunityId
        to_columns:
          - opportunityId
        ai_context:
          instructions: The opportunity a pricing case prices.
      - name: lineOf
        from: RateCardLine
        to: DealPricing
        from_columns:
          - pricingId
        to_columns:
          - pricingId
        ai_context:
          instructions: The pricing case a rate card line belongs to.
      - name: disputes
        from: PricingDispute
        to: Opportunity
        from_columns:
          - opportunityId
        to_columns:
          - opportunityId
        ai_context:
          instructions: The opportunity whose pricing is disputed.
      - name: allianceWith
        from: PartnerAlliance
        to: EcosystemPartner
        from_columns:
          - partnerName
        to_columns:
          - partnerName
        ai_context:
          instructions: "The ecosystem partner in an alliance. Partners are known only
            through the alliances that name them: every distinct partner name
            recorded on an alliance is one ecosystem partner."
      - name: allianceFor
        from: PartnerAlliance
        to: ClientAccount
        from_columns:
          - accountId
        to_columns:
          - accountId
        ai_context:
          instructions: The client account an alliance is for.
      - name: scorecardOf
        from: ClientHealthScorecard
        to: ClientAccount
        from_columns:
          - accountId
        to_columns:
          - accountId
        ai_context:
          instructions: The client account a health scorecard surveys.
      - name: adjusts
        from: PriceAdjustment
        to: RateCardLine
        from_columns:
          - rateLineId
        to_columns:
          - rateLineId
        ai_context:
          instructions: The rate card line whose rate a price adjustment changes.
      - name: targetOf
        from: SalesTarget
        to: SalesTeamMember
        from_columns:
          - salesTeamMemberId
        to_columns:
          - salesTeamMemberId
        ai_context:
          instructions: The seller a sales target is set for.
      - name: targetInMarket
        from: SalesTarget
        to: MarketUnit
        extends:
          - belongsToTerritory
        from_columns:
          - marketUnitCode
        to_columns:
          - marketUnitCode
        ai_context:
          instructions: The market unit a sales target applies to, as recorded.
      - name: targetForServiceGroup
        from: SalesTarget
        to: ServiceGroup
        from_columns:
          - serviceGroupCode
        to_columns:
          - serviceGroupCode
        ai_context:
          instructions: The service group a sales target applies to, as recorded.
      - name: snapshotInMarket
        from: PipelineSnapshot
        to: MarketUnit
        extends:
          - belongsToTerritory
        from_columns:
          - marketUnitCode
        to_columns:
          - marketUnitCode
        ai_context:
          instructions: The market unit a pipeline snapshot covers, as recorded.
      - name: snapshotForServiceGroup
        from: PipelineSnapshot
        to: ServiceGroup
        from_columns:
          - serviceGroupCode
        to_columns:
          - serviceGroupCode
        ai_context:
          instructions: The service group a pipeline snapshot covers, as recorded.
      - name: signalFor
        from: IntentSignal
        to: ClientAccount
        from_columns:
          - accountId
        to_columns:
          - accountId
        ai_context:
          instructions: The client account an intent signal was observed for.
      - name: forecastForMarket
        from: IndustryForecast
        to: MarketUnit
        extends:
          - belongsToTerritory
        from_columns:
          - marketUnitCode
        to_columns:
          - marketUnitCode
        ai_context:
          instructions: The market unit an industry forecast is attributed to, as recorded.
      - name: forecastForServiceGroup
        from: IndustryForecast
        to: ServiceGroup
        from_columns:
          - serviceGroupCode
        to_columns:
          - serviceGroupCode
        ai_context:
          instructions: The service group an industry forecast is attributed to, as recorded.
      - name: partnersWith
        from: ClientAccount
        to: EcosystemPartner
        extends:
          - relatedParty
        via:
          - ^allianceFor
          - allianceWith
        ai_context:
          instructions: >-
            A client account and an ecosystem partner that have an alliance.
            Inferred from PartnerAlliance records.


            partnersWith is symmetric: a partnersWith b implies b partnersWith
            a, but each pair may be stored in one direction only. Match it
            undirected, e.g. MATCH
            (a:ClientAccount)-[:partnersWith]-(b:EcosystemPartner).
      - name: hasStatus
        from: ContractAgreement
        to: ContractStatus
        from_columns:
          - contractStatus
        to_columns:
          - statusCode
        ai_context:
          instructions: The lifecycle status of a contract agreement.
      - name: contractFor
        from: ContractAgreement
        to: Opportunity
        inverse: governedBy
        from_columns:
          - opportunityId
        to_columns:
          - opportunityId
        ai_context:
          instructions: The opportunity a contract agreement was signed for.
      - name: amends
        from: ChangeOrder
        to: ContractAgreement
        from_columns:
          - contractNumber
        to_columns:
          - contractNumber
        ai_context:
          instructions: The contract agreement a change order modifies.
      - name: obligationOf
        from: ContractObligation
        to: ContractAgreement
        from_columns:
          - contractNumber
        to_columns:
          - contractNumber
        ai_context:
          instructions: The contract agreement an obligation belongs to.
      - name: hasHealth
        from: Engagement
        to: HealthStatus
        from_columns:
          - healthStatus
        to_columns:
          - healthCode
        ai_context:
          instructions: The current delivery health of an engagement.
      - name: delivers
        from: Engagement
        to: Opportunity
        inverse: deliveredBy
        from_columns:
          - opportunityId
        to_columns:
          - opportunityId
        ai_context:
          instructions: The won opportunity an engagement delivers.
      - name: executes
        from: Engagement
        to: ContractAgreement
        from_columns:
          - contractNumber
        to_columns:
          - contractNumber
        ai_context:
          instructions: The contract agreement an engagement executes.
      - name: ledBy
        from: Engagement
        to: SalesTeamMember
        from_columns:
          - deliveryLeadId
        to_columns:
          - salesTeamMemberId
        ai_context:
          instructions: The client-facing lead accountable for an engagement's delivery.
          synonyms:
            - delivery lead
      - name: milestoneOf
        from: Milestone
        to: Engagement
        from_columns:
          - engagementId
        to_columns:
          - engagementId
        ai_context:
          instructions: The engagement a milestone belongs to.
      - name: checks
        from: QAHealthCheck
        to: Engagement
        inverse: hasHealthCheck
        from_columns:
          - engagementId
        to_columns:
          - engagementId
        ai_context:
          instructions: The engagement a QA health check reviews.
      - name: staffedOn
        from: StaffingAssignment
        to: Engagement
        from_columns:
          - engagementId
        to_columns:
          - engagementId
        ai_context:
          instructions: The engagement a staffing assignment is for.
      - name: assignee
        from: StaffingAssignment
        to: Employee
        from_columns:
          - employeeId
        to_columns:
          - employeeId
        ai_context:
          instructions: The employee on a staffing assignment.
      - name: recordedAgainst
        from: TimesheetEntry
        to: StaffingAssignment
        from_columns:
          - assignmentId
        to_columns:
          - assignmentId
        ai_context:
          instructions: The staffing assignment a timesheet entry is recorded against.
      - name: employeeHomeMarket
        from: Employee
        to: MarketUnit
        extends:
          - belongsToTerritory
        from_columns:
          - homeMarketUnit
        to_columns:
          - marketUnitCode
        ai_context:
          instructions: The home market unit of an employee.
      - name: deliveredFor
        from: Engagement
        to: ClientAccount
        from_columns:
          - accountId
        to_columns:
          - accountId
        ai_context:
          instructions: "The client account an engagement is delivered for, as recorded on
            the engagement. Recorded independently of the contract: it almost
            never equals the payer of the contract the engagement executes
            (executes / hasPayer), so the two answers differ."
          synonyms:
            - engagement client
      - name: recordedBy
        from: TimesheetEntry
        to: Employee
        from_columns:
          - employeeId
        to_columns:
          - employeeId
        ai_context:
          instructions: "The employee who recorded a timesheet entry, as recorded on the
            entry. Recorded independently of the staffing assignment: it almost
            never equals the assignment's employee (recordedAgainst / assignee),
            so the two answers differ."
      - name: recordedOn
        from: TimesheetEntry
        to: Engagement
        from_columns:
          - engagementId
        to_columns:
          - engagementId
        ai_context:
          instructions: "The engagement a timesheet entry's hours were charged to, as
            recorded on the entry. Recorded independently of the staffing
            assignment: it almost never equals the assignment's engagement
            (recordedAgainst / staffedOn), so the two answers differ."
      - name: hasPayer
        from: ContractAgreement
        to: ClientAccount
        extends:
          - hasCounterparty
        from_columns:
          - accountId
        to_columns:
          - accountId
        ai_context:
          instructions: The counterparty that pays under a contract agreement.
          synonyms:
            - bill to
      - name: financesOpportunity
        from: WBSElement
        to: Opportunity
        from_columns:
          - opportunityId
        to_columns:
          - opportunityId
        ai_context:
          instructions: The won opportunity a WBS element was set up for.
      - name: postedTo
        from: RevenueActual
        to: WBSElement
        from_columns:
          - wbsElementCode
        to_columns:
          - wbsElementCode
        ai_context:
          instructions: The WBS element a revenue posting belongs to.
      - name: bookedOn
        from: Booking
        to: WBSElement
        from_columns:
          - wbsElementCode
        to_columns:
          - wbsElementCode
        ai_context:
          instructions: The WBS element a booking is recorded on.
      - name: wbsInMarket
        from: WBSElement
        to: MarketUnit
        extends:
          - belongsToTerritory
        from_columns:
          - marketUnitCode
        to_columns:
          - marketUnitCode
        ai_context:
          instructions: The market unit a WBS element is set up in, as recorded in the
            ledger.
      - name: revenueInMarket
        from: RevenueActual
        to: MarketUnit
        extends:
          - belongsToTerritory
        from_columns:
          - marketUnitCode
        to_columns:
          - marketUnitCode
        ai_context:
          instructions: The market unit a revenue posting is recognized in, as recorded in
            the ledger.
      - name: revenueForServiceGroup
        from: RevenueActual
        to: ServiceGroup
        from_columns:
          - serviceGroupCode
        to_columns:
          - serviceGroupCode
        ai_context:
          instructions: The service group a revenue posting is attributed to, as recorded
            in the ledger.
      - name: bookingInMarket
        from: Booking
        to: MarketUnit
        extends:
          - belongsToTerritory
        from_columns:
          - marketUnitCode
        to_columns:
          - marketUnitCode
        ai_context:
          instructions: The market unit a booking is recorded in, as recorded in the ledger.
    metrics:
      - name: total_contract_value
        expression:
          dialects:
            - dialect: BIGQUERY
              expression: SUM(Opportunity.totalContractValue)
        description: |-
          Total contract value of the opportunities in scope, USD.

          Unit: USD.
        ai_context:
          synonyms:
            - Total contract value
            - TCV
            - deal value
            - pipeline value
      - name: won_amount
        expression:
          dialects:
            - dialect: BIGQUERY
              expression: SUM(Opportunity.wonAmount)
        description: |-
          Amount credited as sold on won opportunities, USD.

          Unit: USD.
        ai_context:
          synonyms:
            - Won amount
            - sales
            - bookings value
            - sold value
      - name: avg_probability_of_win
        expression:
          dialects:
            - dialect: BIGQUERY
              expression: AVG(Opportunity.probabilityOfWin)
        description: |-
          Average estimated probability of win (0-1).

          Unit: ratio.
        ai_context:
          synonyms:
            - Average probability of win
            - average PWIN
      - name: win_rate_pct
        expression:
          dialects:
            - dialect: BIGQUERY
              expression: 100 * SAFE_DIVIDE(COUNTIF(LOWER(Opportunity.salesStage) = '5_won'),
                COUNTIF(LOWER(Opportunity.salesStage) IN ('5_won',
                'closed_lost')))
        description: >-
          Won opportunities as a percentage of closed (won + lost)
          opportunities. Stage codes are compared case-insensitively because the
          source CRM mixes '5_won' and '5_WON'.


          Unit: percent.
        ai_context:
          instructions: Only closed opportunities are in the denominator; open pipeline is
            excluded.
          synonyms:
            - Win rate percentage
            - win rate
            - close rate
            - hit rate
      - name: weighted_pipeline
        expression:
          dialects:
            - dialect: BIGQUERY
              expression: SUM(Opportunity.totalContractValue * Opportunity.probabilityOfWin)
        description: |-
          Probability-weighted total contract value, USD.

          Unit: USD.
        ai_context:
          synonyms:
            - Weighted pipeline
            - weighted TCV
            - expected value
      - name: avg_daily_rate
        expression:
          dialects:
            - dialect: BIGQUERY
              expression: AVG(RateCardLine.averageDailyRate)
        description: |-
          Average daily rate across rate card lines, USD per person-day.

          Unit: USD per person-day.
        ai_context:
          synonyms:
            - Average daily rate
            - ADR
            - average day rate
      - name: approved_discount_pct
        expression:
          dialects:
            - dialect: BIGQUERY
              expression: AVG(DealPricing.approvedDiscountPct)
        description: |-
          Average approved discount across pricing cases.

          Unit: ratio.
        ai_context:
          synonyms:
            - Approved discount
      - name: delivered_margin_pct
        expression:
          dialects:
            - dialect: BIGQUERY
              expression: AVG(Engagement.eacMarginPct)
        description: >-
          Average estimate-at-completion contribution margin of engagements
          (delivered margin).


          Unit: percent.
        ai_context:
          synonyms:
            - Delivered margin
            - delivered contribution margin
            - EAC margin
      - name: services_revenue
        expression:
          dialects:
            - dialect: BIGQUERY
              expression: SUM(RevenueActual.servicesRevenue)
        description: |-
          Recognized services revenue, USD.

          Unit: USD.
        ai_context:
          synonyms:
            - Services revenue
            - revenue
            - net revenue
      - name: cost_to_serve
        expression:
          dialects:
            - dialect: BIGQUERY
              expression: SUM(RevenueActual.costToServe)
        description: |-
          Cost incurred to deliver, USD.

          Unit: USD.
        ai_context:
          synonyms:
            - Cost to serve
      - name: contribution_margin_pct
        expression:
          dialects:
            - dialect: BIGQUERY
              expression: 100 * SAFE_DIVIDE(SUM(RevenueActual.servicesRevenue) -
                SUM(RevenueActual.costToServe),
                SUM(RevenueActual.servicesRevenue))
        description: >-
          (Services revenue - cost to serve) / services revenue, as a
          percentage.


          Unit: percent.
        ai_context:
          synonyms:
            - Contribution margin percentage
            - contribution margin
            - CM%
      - name: billable_hours
        expression:
          dialects:
            - dialect: BIGQUERY
              expression: SUM(TimesheetEntry.billableHours)
        description: |-
          Hours charged to clients.

          Unit: hours.
        ai_context:
          synonyms:
            - Billable hours
            - chargeable hours
      - name: chargeable_utilization_pct
        expression:
          dialects:
            - dialect: BIGQUERY
              expression: 100 * SAFE_DIVIDE(SUM(TimesheetEntry.billableHours),
                SUM(TimesheetEntry.billableHours) +
                SUM(TimesheetEntry.nonBillableHours))
        description: |-
          Billable hours as a percentage of all recorded hours.

          Unit: percent.
        ai_context:
          synonyms:
            - Chargeable utilization
            - utilization
            - chargeability
    constraints:
      - name: Opportunity_hasBuyer_exactly_1
        judgment: Each Opportunity has exactly one hasBuyer relationship to a
          ClientAccount. An Opportunity with no hasBuyer relationship to a
          ClientAccount, or with more than one, does not satisfy this rule.
        description: "Link each Opportunity to exactly one ClientAccount through
          hasBuyer. (From OWL: Opportunity SubClassOf hasBuyer exactly 1
          ClientAccount.)"
        on_violation: warn
      - name: Opportunity_governedBy_max_1
        judgment: Each Opportunity is linked from at most one ContractAgreement via
          contractFor (governedBy is contractFor read backwards). An Opportunity
          linked from more than one does not satisfy this rule.
        description: "Link each Opportunity from at most one ContractAgreement through
          contractFor. (From OWL: Opportunity SubClassOf governedBy max 1
          ContractAgreement.)"
        on_violation: warn
      - name: WonOpportunity_deliveredBy_some_QAAssuredEngagement
        judgment: Each WonOpportunity is linked from at least one QAAssuredEngagement
          via delivers (deliveredBy is delivers read backwards). A
          WonOpportunity linked from no QAAssuredEngagement via delivers does
          not satisfy this rule.
        description: "Link each WonOpportunity from at least one QAAssuredEngagement
          through delivers. (From OWL: WonOpportunity SubClassOf deliveredBy
          some QAAssuredEngagement.)"
        on_violation: warn
      - name: QAAssuredEngagement_hasHealthCheck_some_QAHealthCheck
        judgment: Each QAAssuredEngagement is linked from at least one QAHealthCheck via
          checks (hasHealthCheck is checks read backwards). A
          QAAssuredEngagement linked from no QAHealthCheck via checks does not
          satisfy this rule.
        description: "Link each QAAssuredEngagement from at least one QAHealthCheck
          through checks. (From OWL: QAAssuredEngagement EquivalentTo Engagement
          and (hasHealthCheck some QAHealthCheck).)"
        on_violation: warn
      - name: MarketUnit_inRegion_functional
        judgment: Each MarketUnit has at most one inRegion relationship. A MarketUnit
          with more than one does not satisfy this rule.
        description: "Link each MarketUnit to at most one GeographicRegion through
          inRegion. (From OWL: inRegion is a FunctionalProperty.)"
        on_violation: warn
      - name: Organization_disjoint_Person
        judgment: No Organization is also a Person. An instance that is both an
          Organization and a Person does not satisfy this rule.
        description: "Classify it as an Organization or a Person, not both. (From OWL:
          Organization DisjointWith Person.)"
        on_violation: warn
      - name: ClientAccount_disjoint_EcosystemPartner
        judgment: No ClientAccount is also an EcosystemPartner. An instance that is both
          a ClientAccount and an EcosystemPartner does not satisfy this rule.
        description: "Classify it as a ClientAccount or an EcosystemPartner, not both.
          (From OWL: ClientAccount DisjointWith EcosystemPartner.)"
        on_violation: warn
      - name: WonOpportunity_disjoint_LostOpportunity
        judgment: No WonOpportunity is also a LostOpportunity. An instance that is both
          a WonOpportunity and a LostOpportunity does not satisfy this rule.
        description: "Classify it as a WonOpportunity or a LostOpportunity, not both.
          (From OWL: WonOpportunity DisjointWith LostOpportunity.)"
        on_violation: warn
      - name: MarketUnit_GeographicRegion_ServiceGroup_disjoint
        judgment: No instance is more than one of MarketUnit, GeographicRegion and
          ServiceGroup. An instance classified as two or more of them does not
          satisfy this rule.
        description: "Classify it as at most one of MarketUnit, GeographicRegion and
          ServiceGroup. (From OWL: DisjointClasses(MarketUnit GeographicRegion
          ServiceGroup).)"
        on_violation: warn
      - name: MasterServicesAgreement_StatementOfWork_Subcontract_Amendment_disjoint
        judgment: No instance is more than one of MasterServicesAgreement,
          StatementOfWork, Subcontract and Amendment. An instance classified as
          two or more of them does not satisfy this rule.
        description: "Classify it as at most one of MasterServicesAgreement,
          StatementOfWork, Subcontract and Amendment. (From OWL:
          DisjointClasses(MasterServicesAgreement StatementOfWork Subcontract
          Amendment).)"
        on_violation: warn
      - name: WBSElement_RevenueActual_Booking_disjoint
        judgment: No instance is more than one of WBSElement, RevenueActual and Booking.
          An instance classified as two or more of them does not satisfy this
          rule.
        description: "Classify it as at most one of WBSElement, RevenueActual and
          Booking. (From OWL: DisjointClasses(WBSElement RevenueActual
          Booking).)"
        on_violation: warn
