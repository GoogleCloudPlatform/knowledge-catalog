# Test fixture -- AI-first semantics format (v0.2.0.dev0).
#
# A graph node requires a KEY, and a relationship's to_columns must cover a key
# of its target. `nokey` declares none, so push rejects the relationship to it.
# If such a model reaches the generator anyway, the keyless node and the edge
# to it are dropped, with warnings; the golden pins that.

version: "0.2.0.dev0"

semantic_model:
  - name: mixed_keys
    datasets:
      - name: facts
        source: facts
        primary_key: [id]
        fields:
          - name: id
            expression:
              dialects: [{ dialect: BIGQUERY, expression: facts.id }]
          - name: nokey_id
            expression:
              dialects: [{ dialect: BIGQUERY, expression: facts.nokey_id }]
      - name: nokey
        source: nokey
        # no primary_key: this dataset cannot become a graph node.
        fields:
          - name: nokey_id
            expression:
              dialects: [{ dialect: BIGQUERY, expression: nokey.nokey_id }]
    relationships:
      - name: facts_to_nokey
        from: facts
        to: nokey
        from_columns: [nokey_id]
        to_columns: [nokey_id]
