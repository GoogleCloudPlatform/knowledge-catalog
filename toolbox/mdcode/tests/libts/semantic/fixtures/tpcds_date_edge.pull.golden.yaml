# (no warnings)
version: 0.2.0.dev0/google
semantic_model:
  - name: tpcds_model
    description: TPC-DS retail model
    entities:
      - name: store_sales
        source: //bigquery.googleapis.com/projects/tpcds/datasets/public/tables/store_sales
        primary_key:
          - ss_item_sk
          - ss_ticket_number
        description: Fact table containing all store sales transactions
        fields:
          - name: ss_item_sk
          - name: ss_ticket_number
          - name: ss_customer_sk
          - name: ss_store_sk
          - name: ss_quantity
            description: Quantity of items sold
          - name: ss_sales_price
            description: Sales price per unit
          - name: ss_ext_sales_price
            description: Extended sales price (quantity * price)
          - name: ss_net_profit
            description: Net profit from the sale
      - name: customer
        source: //bigquery.googleapis.com/projects/tpcds/datasets/public/tables/customer
        primary_key:
          - c_customer_sk
        description: Customer dimension with demographic information
        fields:
          - name: c_customer_sk
          - name: c_first_name
            description: Customer first name
          - name: c_last_name
            description: Customer last name
      - name: item
        source: //bigquery.googleapis.com/projects/tpcds/datasets/public/tables/item
        primary_key:
          - i_item_sk
        description: Item/Product dimension
        fields:
          - name: i_item_sk
          - name: i_brand
          - name: i_category
          - name: i_current_price
            description: Current price of the item
      - name: store
        source: //bigquery.googleapis.com/projects/tpcds/datasets/public/tables/store
        primary_key:
          - s_store_sk
        description: Store dimension with location attributes
        fields:
          - name: s_store_sk
          - name: s_store_name
          - name: s_city
          - name: s_state
          - name: s_number_employees
            description: Number of employees at the store
      - name: date_dim
        source: //bigquery.googleapis.com/projects/sqlgen-testing/datasets/demo/tables/date_dim
        primary_key:
          - ss_sold_date_sk
        description: Date dimension with calendar attributes
    relationships:
      - name: store_sales_to_date_dim
        from: store_sales
        to: date_dim
        from_columns:
          - ss_sold_date_sk
        to_columns:
          - ss_sold_date_sk
      - name: store_sales_to_customer
        from: store_sales
        to: customer
        from_columns:
          - ss_customer_sk
        to_columns:
          - c_customer_sk
      - name: store_sales_to_item
        from: store_sales
        to: item
        from_columns:
          - ss_item_sk
        to_columns:
          - i_item_sk
      - name: store_sales_to_store
        from: store_sales
        to: store
        from_columns:
          - ss_store_sk
        to_columns:
          - s_store_sk
