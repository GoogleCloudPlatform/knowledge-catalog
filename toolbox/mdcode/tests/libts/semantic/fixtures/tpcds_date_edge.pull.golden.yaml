# (no warnings)
version: 0.2.0.dev0
semantic_model:
  - name: tpcds_model
    description: TPC-DS retail model
    datasets:
      - name: store_sales
        source: tpcds.public.store_sales
        description: Fact table containing all store sales transactions
        fields:
          - name: ss_item_sk
          - name: ss_ticket_number
          - name: ss_customer_sk
          - name: ss_store_sk
          - name: ss_quantity
            description: Quantity of items sold
          - name: ss_sales_price
            description: Sales price per unit
          - name: ss_ext_sales_price
            description: Extended sales price (quantity * price)
          - name: ss_net_profit
            description: Net profit from the sale
      - name: customer
        source: tpcds.public.customer
        description: Customer dimension with demographic information
        fields:
          - name: c_customer_sk
          - name: c_first_name
            description: Customer first name
          - name: c_last_name
            description: Customer last name
      - name: item
        source: tpcds.public.item
        description: Item/Product dimension
        fields:
          - name: i_item_sk
          - name: i_brand
          - name: i_category
          - name: i_current_price
            description: Current price of the item
      - name: store
        source: tpcds.public.store
        description: Store dimension with location attributes
        fields:
          - name: s_store_sk
          - name: s_store_name
          - name: s_city
          - name: s_state
          - name: s_number_employees
            description: Number of employees at the store
      - name: date_dim
        source: sqlgen-testing.demo.date_dim
        description: Date dimension with calendar attributes
    relationships:
      - name: store-sales-to-date-dim
        from: store_sales
        to: date_dim
        from_columns:
          - ss_sold_date_sk
        to_columns:
          - ss_sold_date_sk
      - name: store-sales-to-customer
        from: store_sales
        to: customer
        from_columns:
          - ss_customer_sk
        to_columns:
          - c_customer_sk
      - name: store-sales-to-item
        from: store_sales
        to: item
        from_columns:
          - ss_item_sk
        to_columns:
          - i_item_sk
      - name: store-sales-to-store
        from: store_sales
        to: store
        from_columns:
          - ss_store_sk
        to_columns:
          - s_store_sk
