# Benchmark model 3 of 6 -- clinical encounters and claims.
#
# Shape: an encounter fact with TWO many-to-many bridges hanging off it
# (diagnoses and procedures), and a separate revenue-cycle chain
# (encounter -> claim -> claim_line -> payer).
#
# What it is here to test:
#   - long join paths: "what did Medicare pay for diabetic admissions at
#     hospital X" is patient/diagnosis -> encounter -> claim -> payer, four
#     entities deep
#   - two independent fan-outs off one fact. Joining both bridges at once
#     multiplies diagnoses by procedures, which is the classic chasm trap
#   - a count that is only correct as a distinct count (unique_patient_count),
#     because a patient has many encounters and each encounter many diagnoses
#   - clinical vs financial grain: charges are on claim_line, length of stay is
#     on encounter, and neither aggregates correctly at the other's grain

version: "0.2.0.dev0"

semantic_model:
  - name: clinical_encounters
    description: >-
      Hospital encounters with their diagnoses and procedures, and the claims
      billed against them.
    ai_context:
      instructions: >-
        Encounter-level measures (length of stay, readmission) live on
        encounter. Money lives on claim and claim_line. Diagnoses and
        procedures are many-to-many with encounter: join at most one bridge per
        query, and count patients and encounters with COUNT(DISTINCT ...) once
        any bridge is in the join. A claim with status DENIED has an allowed
        amount of zero.

    datasets:
      - name: patient
        source: clinical.public.patient
        primary_key: [patient_id]
        description: One row per patient. No direct identifiers are carried.
        ai_context:
          synonyms: ["patient", "member", "person", "individual"]
        fields:
          - name: patient_id
            datatype: String
            expression:
              dialects: [{dialect: ANSI_SQL, expression: patient_id}]
          - name: birth_year
            datatype: Integer
            description: Year of birth, the coarsest age attribute carried.
            expression:
              dialects: [{dialect: ANSI_SQL, expression: birth_year}]
            ai_context:
              synonyms: ["age", "birth year", "how old"]
          - name: sex
            datatype: String
            expression:
              dialects: [{dialect: ANSI_SQL, expression: sex}]
          - name: postal_region
            datatype: String
            description: Three-digit postal prefix of the patient's residence.
            expression:
              dialects: [{dialect: ANSI_SQL, expression: postal_region}]
            ai_context:
              synonyms: ["region", "where they live", "geography"]
          - name: primary_language
            datatype: String
            expression:
              dialects: [{dialect: ANSI_SQL, expression: primary_language}]
          - name: risk_score
            datatype: Float
            description: Actuarial risk score; higher means expected higher cost.
            expression:
              dialects: [{dialect: ANSI_SQL, expression: risk_score}]
            ai_context:
              synonyms: ["risk score", "acuity", "severity"]

      - name: provider
        source: clinical.public.provider
        primary_key: [provider_id]
        description: One row per clinician.
        ai_context:
          synonyms: ["provider", "physician", "doctor", "clinician", "attending"]
        fields:
          - name: provider_id
            datatype: String
            expression:
              dialects: [{dialect: ANSI_SQL, expression: provider_id}]
          - name: provider_name
            datatype: String
            expression:
              dialects: [{dialect: ANSI_SQL, expression: provider_name}]
          - name: specialty
            datatype: String
            description: Clinical specialty, e.g. Cardiology, Oncology, Internal Medicine.
            expression:
              dialects: [{dialect: ANSI_SQL, expression: specialty}]
            ai_context:
              synonyms: ["specialty", "department", "service line"]
          - name: primary_facility_id
            datatype: String
            expression:
              dialects: [{dialect: ANSI_SQL, expression: primary_facility_id}]
          - name: years_in_practice
            datatype: Integer
            expression:
              dialects: [{dialect: ANSI_SQL, expression: years_in_practice}]

      - name: facility
        source: clinical.public.facility
        primary_key: [facility_id]
        description: One row per hospital or clinic.
        ai_context:
          synonyms: ["facility", "hospital", "clinic", "site", "location"]
        fields:
          - name: facility_id
            datatype: String
            expression:
              dialects: [{dialect: ANSI_SQL, expression: facility_id}]
          - name: facility_name
            datatype: String
            expression:
              dialects: [{dialect: ANSI_SQL, expression: facility_name}]
          - name: facility_type
            datatype: String
            description: One of ACUTE_HOSPITAL, CRITICAL_ACCESS, AMBULATORY, CLINIC.
            expression:
              dialects: [{dialect: ANSI_SQL, expression: facility_type}]
          - name: state
            datatype: String
            expression:
              dialects: [{dialect: ANSI_SQL, expression: state}]
          - name: staffed_beds
            datatype: Integer
            description: Licensed and staffed inpatient beds.
            expression:
              dialects: [{dialect: ANSI_SQL, expression: staffed_beds}]
            ai_context:
              synonyms: ["beds", "capacity", "bed count"]
          - name: is_teaching
            datatype: Boolean
            expression:
              dialects: [{dialect: ANSI_SQL, expression: is_teaching}]

      - name: encounter
        source: clinical.public.encounter
        primary_key: [encounter_id]
        description: >-
          One row per visit or admission. The clinical grain; no money lives
          here.
        ai_context:
          synonyms: ["encounter", "visit", "admission", "stay", "episode"]
        fields:
          - name: encounter_id
            datatype: String
            expression:
              dialects: [{dialect: ANSI_SQL, expression: encounter_id}]
          - name: patient_id
            datatype: String
            expression:
              dialects: [{dialect: ANSI_SQL, expression: patient_id}]
          - name: attending_provider_id
            datatype: String
            expression:
              dialects: [{dialect: ANSI_SQL, expression: attending_provider_id}]
          - name: facility_id
            datatype: String
            expression:
              dialects: [{dialect: ANSI_SQL, expression: facility_id}]
          - name: admit_date
            datatype: Date
            dimension:
              is_time: true
            expression:
              dialects: [{dialect: ANSI_SQL, expression: admit_date}]
            ai_context:
              synonyms: ["admission date", "when admitted", "visit date"]
          - name: discharge_date
            datatype: Date
            dimension:
              is_time: true
            expression:
              dialects: [{dialect: ANSI_SQL, expression: discharge_date}]
            ai_context:
              synonyms: ["discharge", "when they left"]
          - name: encounter_type
            datatype: String
            description: One of INPATIENT, OUTPATIENT, EMERGENCY, OBSERVATION, TELEHEALTH.
            expression:
              dialects: [{dialect: ANSI_SQL, expression: encounter_type}]
            ai_context:
              synonyms: ["visit type", "setting", "inpatient or outpatient"]
          - name: length_of_stay_days
            datatype: Integer
            description: Nights between admission and discharge; zero for outpatient.
            expression:
              dialects: [{dialect: ANSI_SQL, expression: length_of_stay_days}]
            ai_context:
              synonyms: ["length of stay", "LOS", "days in hospital"]
          - name: discharge_disposition
            datatype: String
            description: One of HOME, SNF, REHAB, TRANSFER, EXPIRED, AMA.
            expression:
              dialects: [{dialect: ANSI_SQL, expression: discharge_disposition}]
            ai_context:
              synonyms: ["discharge disposition", "where they went"]
          - name: is_readmission_30d
            datatype: Boolean
            description: >-
              True when this encounter began within 30 days of a prior
              discharge for the same patient. Precomputed, so readmission needs
              no self-join.
            expression:
              dialects: [{dialect: ANSI_SQL, expression: is_readmission_30d}]
            ai_context:
              synonyms: ["readmission", "came back", "bounce back"]
          - name: is_emergency_admit
            datatype: Boolean
            expression:
              dialects: [{dialect: ANSI_SQL, expression: is_emergency_admit}]

      - name: diagnosis_code
        source: clinical.public.diagnosis_code
        primary_key: [diagnosis_code]
        description: One row per ICD-10 diagnosis code.
        ai_context:
          synonyms: ["diagnosis", "ICD code", "condition", "DX"]
        fields:
          - name: diagnosis_code
            datatype: String
            expression:
              dialects: [{dialect: ANSI_SQL, expression: diagnosis_code}]
          - name: diagnosis_description
            datatype: String
            expression:
              dialects: [{dialect: ANSI_SQL, expression: diagnosis_description}]
          - name: diagnosis_chapter
            datatype: String
            description: ICD-10 chapter, e.g. Endocrine, Circulatory, Neoplasms.
            expression:
              dialects: [{dialect: ANSI_SQL, expression: diagnosis_chapter}]
            ai_context:
              synonyms: ["condition category", "disease group", "chapter"]
          - name: is_chronic
            datatype: Boolean
            expression:
              dialects: [{dialect: ANSI_SQL, expression: is_chronic}]
            ai_context:
              synonyms: ["chronic", "long-term condition"]

      - name: encounter_diagnosis
        source: clinical.public.encounter_diagnosis
        primary_key: [encounter_id, diagnosis_code]
        description: >-
          Bridge between an encounter and the diagnoses coded on it. An
          encounter commonly carries ten or more.
        ai_context:
          synonyms: ["coded diagnosis", "diagnosis on the visit", "DX bridge"]
        fields:
          - name: encounter_id
            datatype: String
            expression:
              dialects: [{dialect: ANSI_SQL, expression: encounter_id}]
          - name: diagnosis_code
            datatype: String
            expression:
              dialects: [{dialect: ANSI_SQL, expression: diagnosis_code}]
          - name: diagnosis_rank
            datatype: Integer
            description: 1 is the principal diagnosis; the rest are secondary.
            expression:
              dialects: [{dialect: ANSI_SQL, expression: diagnosis_rank}]
            ai_context:
              synonyms: ["principal diagnosis", "primary vs secondary", "rank"]
          - name: present_on_admission
            datatype: Boolean
            description: Whether the condition existed before the encounter began.
            expression:
              dialects: [{dialect: ANSI_SQL, expression: present_on_admission}]
            ai_context:
              synonyms: ["present on admission", "POA", "pre-existing"]

      - name: procedure_code
        source: clinical.public.procedure_code
        primary_key: [procedure_code]
        description: One row per CPT/HCPCS procedure code.
        ai_context:
          synonyms: ["procedure", "CPT code", "operation", "treatment"]
        fields:
          - name: procedure_code
            datatype: String
            expression:
              dialects: [{dialect: ANSI_SQL, expression: procedure_code}]
          - name: procedure_description
            datatype: String
            expression:
              dialects: [{dialect: ANSI_SQL, expression: procedure_description}]
          - name: procedure_category
            datatype: String
            description: e.g. Imaging, Surgery, Laboratory, Evaluation.
            expression:
              dialects: [{dialect: ANSI_SQL, expression: procedure_category}]
            ai_context:
              synonyms: ["procedure type", "service category"]
          - name: is_surgical
            datatype: Boolean
            expression:
              dialects: [{dialect: ANSI_SQL, expression: is_surgical}]
          - name: relative_value_units
            datatype: Float
            description: Work RVUs assigned to the procedure.
            expression:
              dialects: [{dialect: ANSI_SQL, expression: relative_value_units}]
            ai_context:
              synonyms: ["RVU", "work units", "effort"]

      - name: encounter_procedure
        source: clinical.public.encounter_procedure
        primary_key: [encounter_id, procedure_code, performed_sequence]
        description: >-
          Bridge between an encounter and the procedures performed on it. The
          second independent fan-out off encounter.
        ai_context:
          synonyms: ["performed procedure", "procedure on the visit"]
        fields:
          - name: encounter_id
            datatype: String
            expression:
              dialects: [{dialect: ANSI_SQL, expression: encounter_id}]
          - name: procedure_code
            datatype: String
            expression:
              dialects: [{dialect: ANSI_SQL, expression: procedure_code}]
          - name: performed_sequence
            datatype: Integer
            description: Distinguishes a procedure repeated within one encounter.
            expression:
              dialects: [{dialect: ANSI_SQL, expression: performed_sequence}]
          - name: performing_provider_id
            datatype: String
            description: >-
              Clinician who performed it, which need not be the encounter's
              attending provider.
            expression:
              dialects: [{dialect: ANSI_SQL, expression: performing_provider_id}]
          - name: performed_date
            datatype: Date
            dimension:
              is_time: true
            expression:
              dialects: [{dialect: ANSI_SQL, expression: performed_date}]
          - name: minutes_duration
            datatype: Integer
            expression:
              dialects: [{dialect: ANSI_SQL, expression: minutes_duration}]

      - name: payer
        source: clinical.public.payer
        primary_key: [payer_id]
        description: One row per insurer or payment program.
        ai_context:
          synonyms: ["payer", "insurer", "insurance", "plan sponsor"]
        fields:
          - name: payer_id
            datatype: String
            expression:
              dialects: [{dialect: ANSI_SQL, expression: payer_id}]
          - name: payer_name
            datatype: String
            expression:
              dialects: [{dialect: ANSI_SQL, expression: payer_name}]
          - name: payer_type
            datatype: String
            description: One of MEDICARE, MEDICAID, COMMERCIAL, SELF_PAY, EXCHANGE.
            expression:
              dialects: [{dialect: ANSI_SQL, expression: payer_type}]
            ai_context:
              synonyms: ["insurance type", "coverage type", "government vs commercial"]
          - name: contract_effective_date
            datatype: Date
            dimension:
              is_time: true
            expression:
              dialects: [{dialect: ANSI_SQL, expression: contract_effective_date}]

      - name: claim
        source: clinical.public.claim
        primary_key: [claim_id]
        description: >-
          One row per claim submitted for an encounter. An encounter may
          generate more than one claim (facility and professional).
        ai_context:
          synonyms: ["claim", "bill", "submission"]
        fields:
          - name: claim_id
            datatype: String
            expression:
              dialects: [{dialect: ANSI_SQL, expression: claim_id}]
          - name: encounter_id
            datatype: String
            expression:
              dialects: [{dialect: ANSI_SQL, expression: encounter_id}]
          - name: payer_id
            datatype: String
            expression:
              dialects: [{dialect: ANSI_SQL, expression: payer_id}]
          - name: claim_type
            datatype: String
            description: One of FACILITY, PROFESSIONAL, PHARMACY.
            expression:
              dialects: [{dialect: ANSI_SQL, expression: claim_type}]
          - name: claim_status
            datatype: String
            description: One of PAID, DENIED, PENDING, APPEALED, PARTIAL.
            expression:
              dialects: [{dialect: ANSI_SQL, expression: claim_status}]
            ai_context:
              synonyms: ["status", "paid or denied", "adjudication"]
          - name: submitted_date
            datatype: Date
            dimension:
              is_time: true
            expression:
              dialects: [{dialect: ANSI_SQL, expression: submitted_date}]
          - name: adjudicated_date
            datatype: Date
            description: Date the payer finished adjudicating; null while pending.
            dimension:
              is_time: true
            expression:
              dialects: [{dialect: ANSI_SQL, expression: adjudicated_date}]
          - name: denial_reason
            datatype: String
            description: Reason code recorded on a DENIED claim.
            expression:
              dialects: [{dialect: ANSI_SQL, expression: denial_reason}]
            ai_context:
              synonyms: ["denial reason", "why denied", "rejection reason"]

      - name: claim_line
        source: clinical.public.claim_line
        primary_key: [claim_line_id]
        description: One row per billed service on a claim. The money grain.
        ai_context:
          synonyms: ["claim line", "billed service", "charge line"]
        fields:
          - name: claim_line_id
            datatype: String
            expression:
              dialects: [{dialect: ANSI_SQL, expression: claim_line_id}]
          - name: claim_id
            datatype: String
            expression:
              dialects: [{dialect: ANSI_SQL, expression: claim_id}]
          - name: procedure_code
            datatype: String
            description: Service billed on this line.
            expression:
              dialects: [{dialect: ANSI_SQL, expression: procedure_code}]
          - name: units
            datatype: Integer
            expression:
              dialects: [{dialect: ANSI_SQL, expression: units}]
          - name: charged_amount
            datatype: Decimal
            description: What the provider billed. A list price, rarely collected.
            expression:
              dialects: [{dialect: ANSI_SQL, expression: charged_amount}]
            ai_context:
              synonyms: ["charges", "billed amount", "gross charges"]
          - name: allowed_amount
            datatype: Decimal
            description: >-
              What the contract permits. Zero on a denied line. This, not
              charges, is the economically meaningful figure.
            expression:
              dialects: [{dialect: ANSI_SQL, expression: allowed_amount}]
            ai_context:
              synonyms: ["allowed", "contracted amount", "negotiated rate"]
          - name: paid_amount
            datatype: Decimal
            description: What the payer actually remitted.
            expression:
              dialects: [{dialect: ANSI_SQL, expression: paid_amount}]
            ai_context:
              synonyms: ["paid", "reimbursement", "remittance"]
          - name: patient_responsibility
            datatype: Decimal
            description: Copay, coinsurance and deductible owed by the patient.
            expression:
              dialects: [{dialect: ANSI_SQL, expression: patient_responsibility}]
            ai_context:
              synonyms: ["patient owes", "out of pocket", "copay"]

    relationships:
      - name: encounter_to_patient
        from: encounter
        to: patient
        from_columns: [patient_id]
        to_columns: [patient_id]
        ai_context:
          instructions: >-
            Each encounter is for one patient; a patient has many.
      - name: encounter_to_attending_provider
        from: encounter
        to: provider
        from_columns: [attending_provider_id]
        to_columns: [provider_id]
        ai_context:
          instructions: >-
            Each encounter has one attending provider.
          synonyms: ["attending", "responsible physician"]
      - name: encounter_to_facility
        from: encounter
        to: facility
        from_columns: [facility_id]
        to_columns: [facility_id]
        ai_context:
          instructions: >-
            Each encounter happens at one facility.
      - name: provider_to_facility
        from: provider
        to: facility
        from_columns: [primary_facility_id]
        to_columns: [facility_id]
        ai_context:
          instructions: >-
            A provider's primary affiliation. Distinct from where any given
            encounter took place.
      - name: encounter_diagnosis_to_encounter
        from: encounter_diagnosis
        to: encounter
        from_columns: [encounter_id]
        to_columns: [encounter_id]
        ai_context:
          instructions: >-
            First leg of the encounter-to-diagnosis many-to-many.
      - name: encounter_diagnosis_to_diagnosis_code
        from: encounter_diagnosis
        to: diagnosis_code
        from_columns: [diagnosis_code]
        to_columns: [diagnosis_code]
        ai_context:
          instructions: >-
            Second leg of the encounter-to-diagnosis many-to-many.
      - name: encounter_procedure_to_encounter
        from: encounter_procedure
        to: encounter
        from_columns: [encounter_id]
        to_columns: [encounter_id]
        ai_context:
          instructions: >-
            First leg of the encounter-to-procedure many-to-many.
      - name: encounter_procedure_to_procedure_code
        from: encounter_procedure
        to: procedure_code
        from_columns: [procedure_code]
        to_columns: [procedure_code]
        ai_context:
          instructions: >-
            Second leg of the encounter-to-procedure many-to-many.
      - name: encounter_procedure_to_performing_provider
        from: encounter_procedure
        to: provider
        from_columns: [performing_provider_id]
        to_columns: [provider_id]
        ai_context:
          instructions: >-
            Who performed the procedure, as opposed to who attended.
      - name: claim_to_encounter
        from: claim
        to: encounter
        from_columns: [encounter_id]
        to_columns: [encounter_id]
        ai_context:
          instructions: >-
            Each claim bills one encounter; an encounter may have several.
      - name: claim_to_payer
        from: claim
        to: payer
        from_columns: [payer_id]
        to_columns: [payer_id]
        ai_context:
          instructions: >-
            Each claim goes to one payer.
      - name: claim_line_to_claim
        from: claim_line
        to: claim
        from_columns: [claim_id]
        to_columns: [claim_id]
        ai_context:
          instructions: >-
            Each billed line belongs to one claim.
      - name: claim_line_to_procedure_code
        from: claim_line
        to: procedure_code
        from_columns: [procedure_code]
        to_columns: [procedure_code]
        ai_context:
          instructions: >-
            Each billed line names one service.

    metrics:
      # --- clinical volume --------------------------------------------------
      - name: encounter_count
        datatype: Integer
        description: >-
          Distinct encounters. Stated as a distinct count because any bridge in
          the join multiplies encounter rows.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: COUNT(DISTINCT encounter.encounter_id)
        ai_context:
          synonyms: ["visits", "admissions", "encounters", "volume"]
      - name: unique_patient_count
        datatype: Integer
        description: Distinct patients seen.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: COUNT(DISTINCT encounter.patient_id)
        ai_context:
          synonyms: ["patients", "unique patients", "how many people"]
      - name: inpatient_days
        datatype: Integer
        description: Total nights across encounters.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(encounter.length_of_stay_days)
        ai_context:
          synonyms: ["patient days", "bed days", "total LOS"]
      - name: average_length_of_stay
        datatype: Float
        description: Mean nights per encounter.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: >-
                SUM(encounter.length_of_stay_days)
                / NULLIF(COUNT(DISTINCT encounter.encounter_id), 0)
        ai_context:
          synonyms: ["ALOS", "average stay", "average length of stay"]
      - name: readmission_rate
        datatype: Float
        description: Share of encounters that were a 30-day readmission.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: >-
                COUNT(DISTINCT CASE WHEN encounter.is_readmission_30d
                      THEN encounter.encounter_id END)
                / NULLIF(COUNT(DISTINCT encounter.encounter_id), 0)
        ai_context:
          synonyms: ["readmission rate", "30-day readmissions", "bounce-back rate"]
      - name: mortality_rate
        datatype: Float
        description: Share of encounters ending in an EXPIRED discharge.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: >-
                COUNT(DISTINCT CASE WHEN encounter.discharge_disposition = 'EXPIRED'
                      THEN encounter.encounter_id END)
                / NULLIF(COUNT(DISTINCT encounter.encounter_id), 0)
        ai_context:
          synonyms: ["mortality", "death rate", "in-hospital mortality"]
      - name: bed_occupancy
        datatype: Float
        description: >-
          Patient days over staffed beds. Numerator is at encounter grain and
          denominator at facility grain.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: >-
                SUM(encounter.length_of_stay_days)
                / NULLIF(SUM(facility.staffed_beds), 0)
        ai_context:
          synonyms: ["occupancy", "bed utilization", "census"]

      # --- coding, across the bridges --------------------------------------
      - name: diagnosis_count
        datatype: Integer
        description: Coded diagnoses. Correct only at the diagnosis-bridge grain.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: COUNT(encounter_diagnosis.diagnosis_code)
        ai_context:
          synonyms: ["diagnoses coded", "number of diagnoses"]
      - name: diagnoses_per_encounter
        datatype: Float
        description: Average coded diagnoses per encounter, a coding-intensity measure.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: >-
                COUNT(encounter_diagnosis.diagnosis_code)
                / NULLIF(COUNT(DISTINCT encounter_diagnosis.encounter_id), 0)
        ai_context:
          synonyms: ["coding intensity", "diagnoses per visit"]
      - name: procedure_count
        datatype: Integer
        description: Procedures performed. Correct only at the procedure-bridge grain.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: COUNT(encounter_procedure.procedure_code)
        ai_context:
          synonyms: ["procedures", "operations performed", "services delivered"]
      - name: total_rvus
        datatype: Float
        description: Work RVUs across performed procedures.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(procedure_code.relative_value_units)
        ai_context:
          synonyms: ["RVUs", "work units", "physician productivity"]
      - name: procedure_minutes
        datatype: Integer
        description: Total procedure time.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(encounter_procedure.minutes_duration)
        ai_context:
          synonyms: ["OR time", "procedure time", "minutes in procedure"]

      # --- revenue cycle ----------------------------------------------------
      - name: total_charges
        datatype: Decimal
        description: Gross amount billed. A list price; use allowed amount for economics.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(claim_line.charged_amount)
        ai_context:
          synonyms: ["charges", "gross billings", "billed"]
      - name: total_allowed
        datatype: Decimal
        description: Contractually allowed amount, the economically real revenue.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(claim_line.allowed_amount)
        ai_context:
          synonyms: ["allowed", "net revenue", "contracted revenue"]
      - name: total_paid
        datatype: Decimal
        description: Amount remitted by payers.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(claim_line.paid_amount)
        ai_context:
          synonyms: ["reimbursement", "payer paid", "collections"]
      - name: patient_responsibility_total
        datatype: Decimal
        description: Amount owed by patients.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(claim_line.patient_responsibility)
        ai_context:
          synonyms: ["patient liability", "out of pocket", "patient owes"]
      - name: collection_ratio
        datatype: Float
        description: Paid over allowed; how much of contracted revenue arrived.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: >-
                SUM(claim_line.paid_amount) / NULLIF(SUM(claim_line.allowed_amount), 0)
        ai_context:
          synonyms: ["collection rate", "yield", "realization"]
      - name: claim_count
        datatype: Integer
        description: Distinct claims submitted.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: COUNT(DISTINCT claim.claim_id)
        ai_context:
          synonyms: ["claims", "submissions", "bills sent"]
      - name: denial_rate
        datatype: Float
        description: Share of claims denied.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: >-
                COUNT(DISTINCT CASE WHEN claim.claim_status = 'DENIED'
                      THEN claim.claim_id END)
                / NULLIF(COUNT(DISTINCT claim.claim_id), 0)
        ai_context:
          synonyms: ["denials", "denial rate", "rejection rate"]
      - name: revenue_per_encounter
        datatype: Decimal
        description: >-
          Allowed amount over distinct encounters. Numerator is at claim-line
          grain and denominator at encounter grain, two hops apart.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: >-
                SUM(claim_line.allowed_amount)
                / NULLIF(COUNT(DISTINCT claim.encounter_id), 0)
        ai_context:
          synonyms: ["revenue per visit", "net revenue per case", "yield per encounter"]
