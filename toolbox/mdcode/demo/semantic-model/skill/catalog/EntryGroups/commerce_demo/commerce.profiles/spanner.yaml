# Where the commerce model lives, and how its one action is carried out.
#
# Everything in this file is a physical fact: a table, a column, the DML. A
# profile may not add an entity, rename a field or change what anything means --
# the loader rejects that -- so reading this file tells you the whole of what is
# deployment-specific about the demo, and nothing about the business.
#
# If you are running against a different project, instance or database, those
# names appear in `deployment_target` and in each `source` below, and nowhere
# else.
#
# The executor is here rather than in the model for the same reason the table
# names are: the same IssueCredit could be performed by an MCP tool against a
# different store, and that would be a second profile, not a second action.

version: "0.2.0.dev0/google"

semantic_model:
  - name: commerce
    deployment_target: //spanner.googleapis.com/projects/my-project/instances/my-instance/databases/semantic_skill_demo/propertyGraphs/commerce

    entities:
      - name: Customer
        source: //spanner.googleapis.com/projects/my-project/instances/my-instance/databases/semantic_skill_demo/tables/Customer
        fields:
          - {name: customerId, expression: customer_id}
          - {name: name, expression: name}
          - {name: email, expression: email}

      # Bound to the VIEW Orders, not to the OrderHeader table underneath it.
      # `total` is summed from the lines there rather than stored, so the
      # entity's own description -- "its total is the sum of its line items" --
      # is true by construction instead of by convention. A source is a source;
      # nothing in the model or in this profile has to say which kind it is.
      - name: Order
        source: //spanner.googleapis.com/projects/my-project/instances/my-instance/databases/semantic_skill_demo/tables/Orders
        fields:
          - {name: orderId, expression: order_id}
          - {name: customerId, expression: customer_id}
          - {name: placedOn, expression: placed_on}
          - {name: total, expression: total}
          - {name: status, expression: status}

      - name: LineItem
        source: //spanner.googleapis.com/projects/my-project/instances/my-instance/databases/semantic_skill_demo/tables/LineItem
        fields:
          - {name: lineItemId, expression: line_item_id}
          - {name: orderId, expression: order_id}
          - {name: type, expression: type}
          - {name: amount, expression: amount}
          - {name: memo, expression: memo}

    actions:
      - name: IssueCredit
        executor:
          sql:
            # One statement, which is the whole action. `statements` is a list
            # and the list is ordered, but nothing here promises the backend
            # commits several of them together -- see actions.md. An action
            # that has to be all-or-nothing wherever it runs is therefore
            # written as one statement, and this one can be because the order
            # total is derived rather than stored: crediting an order is
            # inserting a line, and there is no second row to keep in step.
            #
            # Physical column names, not the model's field names: the statement
            # is handed to Spanner as written. The new row's key comes from the
            # statement too -- `GENERATE_UUID()` is Spanner's, and kcmd binds
            # nothing for it.
            statements:
              - >-
                INSERT INTO LineItem (line_item_id, order_id, type, amount, memo)
                VALUES (GENERATE_UUID(), @order, 'credit', -@amount, @memo)
