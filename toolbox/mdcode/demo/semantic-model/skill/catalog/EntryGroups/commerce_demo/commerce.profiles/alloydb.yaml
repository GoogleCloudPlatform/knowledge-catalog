# The same commerce model, in AlloyDB.
#
# Read this file beside commerce.profiles/spanner.yaml and the differences are a
# deployment target, three table names, one column name, and PostgreSQL in place
# of GoogleSQL in the statement. Everything the business means is in
# commerce.yaml and is untouched.
#
# What each difference is:
#
#   * The deployment target names a DATABASE and stops there, where the Spanner
#     one ends in `/propertyGraphs/commerce`. AlloyDB has no property-graph DDL,
#     so there is no graph to deploy and `kcmd push` has nothing to do under this
#     profile -- it will say so. The model still RUNS here, which is what a
#     deployment target is for on this side.
#
#   * The tables are `customer`, `purchase_order` and `order_line`, because that
#     is what somebody who only ever used PostgreSQL would have called them. The
#     model calls the entities Customer, Order and LineItem in all three
#     deployments.
#
#   * `Order.total` is bound to `order_total` here and to `total` on the other
#     two. One renamed column is enough to show that a field is a logical name
#     rather than a column with a nicer spelling.
#
#   * The statement is PostgreSQL. Nothing rewrites SQL a profile author wrote
#     -- it is handed to the database as typed -- so a profile is where dialect
#     belongs.
#
#   * The parameters are still `@name`, which is the model's one spelling for a
#     parameter across every backend. Spanner and BigQuery bind that spelling
#     natively; PostgreSQL does not have it at all, and answers `syntax error at
#     or near "@"` to a statement sent verbatim. So whatever runs this profile
#     has to bind `@order`, `@amount` and `@memo` as the positional `$1`, `$2`,
#     `$3` its driver wants. That is a real cost of one spelling, and it is
#     stated here rather than discovered: the skill generated from this profile
#     prints the statement as written and says to run what is written.
#
# This is the profile the demo does NOT run. `kcmd push` has no AlloyDB client,
# so the pre-flight that checks the statement against the store on the other two
# profiles has nothing to check it with here -- which makes this file the honest
# third case rather than a second copy of the same evidence.
#
# If you are running against a different project, region, cluster, instance or
# database, those names appear in `deployment_target` and in each `source` below,
# and nowhere else.

version: "0.2.0.dev0/google"

semantic_model:
  - name: commerce
    deployment_target: //alloydb.googleapis.com/projects/my-project/locations/us-central1/clusters/my-cluster/instances/my-instance/databases/semantic_skill_demo

    entities:
      - name: Customer
        source: //alloydb.googleapis.com/projects/my-project/locations/us-central1/clusters/my-cluster/instances/my-instance/databases/semantic_skill_demo/tables/customer
        fields:
          - {name: customerId, expression: customer_id}
          - {name: name, expression: name}
          - {name: email, expression: email}

      - name: Order
        source: //alloydb.googleapis.com/projects/my-project/locations/us-central1/clusters/my-cluster/instances/my-instance/databases/semantic_skill_demo/tables/purchase_order
        fields:
          - {name: orderId, expression: order_id}
          - {name: customerId, expression: customer_id}
          - {name: placedOn, expression: placed_on}
          - {name: total, expression: order_total}
          - {name: status, expression: status}

      - name: LineItem
        source: //alloydb.googleapis.com/projects/my-project/locations/us-central1/clusters/my-cluster/instances/my-instance/databases/semantic_skill_demo/tables/order_line
        fields:
          - {name: lineItemId, expression: line_item_id}
          - {name: orderId, expression: order_id}
          - {name: type, expression: type}
          - {name: amount, expression: amount}
          - {name: memo, expression: memo}

    actions:
      - name: IssueCredit
        executor:
          sql:
            statements:
              # Physical column names, not the model's field names, exactly as
              # on the other two profiles. The new row's key comes from the
              # statement here too, in this dialect's spelling:
              # `gen_random_uuid()` cast to the text the column holds.
              - >-
                INSERT INTO order_line (line_item_id, order_id, type, amount, memo)
                VALUES (gen_random_uuid()::text, @order, 'credit', -@amount, @memo)
