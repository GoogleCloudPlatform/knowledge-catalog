# What the business is, and what one agent is allowed to do to it.
#
# The business is a small ecommerce operation: customers, their orders, and the
# lines that make up an order. One thing can be done to it -- credit a customer
# against an order -- and the rules below say when that is allowed. The README
# runs one request against it, the kind a support desk gets every day: a
# customer was charged for shipping that should have been free.
#
# Nothing here says where the data lives, what the columns are called, or what
# SQL performs the write. Those are physical facts, and they are in
# commerce.profiles/. There are two profiles -- spanner.yaml and alloydb.yaml --
# pointing this one model at two different databases, with different table
# names, a differently named column and a different SQL dialect between them.
# This file is the same bytes under both, which is the claim the pair exists to
# make.
#
# The same policy is written twice, once in arithmetic and once in words. A
# constraint carries either an `expression` a query settles or a `judgment` a
# language model settles, and `IssueCredit` guards on the judgments, because
# those are the ones something can answer today. The expressions are declared
# and named by nothing, which makes them inert: a constraint takes effect where
# something references it.
#
# One of the judgments compares the call against a row in the database, which
# a judge can settle only if it can read the database. Running this demo
# therefore takes a judge that has been given one -- `--judge-reads-store` on
# the command line, or a `store` on the judge the agent hires.

version: "0.2.0.dev0/google"

semantic_model:
  - name: commerce
    description: Customers, their orders, and the lines that make up an order

    # How this business wants to be acted on. It is here rather than in the
    # agent's source because it is true of every agent that acts on this model,
    # including the ones nobody has written yet -- and because a rule an agent
    # keeps privately is a rule that can be changed without the people who own
    # the model finding out. Agents come and go; the model stays.
    #
    # Only what is specific to this business belongs here. How to use a lookup
    # tool, and what to do when a write is refused, are properties of the tools
    # rather than of commerce, so the derivation supplies those and this does
    # not repeat them.
    ai_context:
      instructions: >-
        You are working an internal operations desk for this business, fixing
        orders on behalf of the people who run it. A request describes an order
        the way a person does -- a customer's name, a day, what went wrong --
        so expect to be given a description where the model expects a number,
        and expect to have to read an order's lines to find out what was
        actually charged.

    entities:
      - name: Customer
        primary_key: [customerId]
        fields:
          - {name: customerId, datatype: Integer}
          - name: name
            datatype: String
            description: The customer's display name, e.g. "Morgan Ellis".
          - {name: email, datatype: String}

      - name: Order
        description: >-
          A customer order. Its total is the sum of its line items: items, tax
          and fees add, credits subtract. A positive total is money owed to the
          company.
        primary_key: [orderId]
        fields:
          - {name: orderId, datatype: Integer}
          - {name: customerId, datatype: Integer}
          - name: placedOn
            datatype: Date
            description: The day the order was placed.
          - name: total
            datatype: Decimal
            description: What the customer owes on this order, in dollars.
          - {name: status, datatype: String, description: OPEN or CLOSED.}

      - name: LineItem
        description: >-
          One line of an order. A charge line is positive; a credit line is
          negative, so that the order total is always a plain sum.
        primary_key: [lineItemId]
        fields:
          - {name: lineItemId, datatype: String}
          - {name: orderId, datatype: Integer}
          - name: type
            datatype: String
            description: item, tax, fee, or credit.
          - {name: amount, datatype: Decimal}
          - {name: memo, datatype: String}

    relationships:
      - name: PlacedBy
        from: Order
        to: Customer
        from_columns: [customer_id]
        to_columns: [customer_id]
      - name: BelongsTo
        from: LineItem
        to: Order
        from_columns: [order_id]
        to_columns: [order_id]

    actions:
      - name: IssueCredit
        description: >-
          Credit a customer against one order -- a late delivery, a coupon, a
          shipping charge applied in error. The credit is added as a negative
          line and the order total is recomputed from the lines.
        parameters:
          - {name: order, type: Order}
          - {name: amount, type: Decimal}
          - {name: memo, type: String}
        # What this call reaches, for a reader of the catalog who does not have
        # the SQL under each profile. Nothing here reaches a statement -- the
        # new row's key comes from the INSERT itself. A profile that cannot bind
        # one of these concepts drops the action from its push instead.
        affects:
          - {concept: LineItem, operation: create, fields: [type, amount, memo]}
          - {concept: Order, operation: modify, fields: [total]}
        # Which rules this call must pass, and the only place a constraint
        # takes effect. All four are judgments, so every gate here costs at
        # least one model call -- the loader says so at load time, and it is
        # the price of gating on the half of the policy something can settle
        # today. The first of them also costs a read, because it is about a
        # number that is in the database rather than in the call.
        guards:
          - CreditWithinOrderTotalWithJudge
          - CreditUnderReviewThresholdWithJudge
          - CreditMemoNamesAServiceFailure
          - CreditIsNotSplitToAvoidReview
        ai_context:
          instructions: >-
            Give the order as its number, the amount in dollars, and a memo
            saying why. Look the order up first if you were given a customer
            name rather than a number: an Order is identified by its key alone.
            Say in the memo what actually went wrong on the order -- a late
            delivery, a damaged item, a shipping charge applied in error --
            and, if this credit is part of a larger amount owed, say that and
            give the total. A rule reads the memo, so a fact left out of it is
            a fact the rule cannot weigh.

    # Rules a query settles. All three are correct, none is referenced, and
    # nothing evaluates one yet -- naming one in `guards` would make the action
    # unrunnable rather than checked. They stay because they are the rules as
    # they should end up: arithmetic a query settles costs no model call and
    # cannot answer two identical calls differently.
    constraints:
      - name: CreditWithinOrderTotal
        expression: amount <= Order.total
        on_violation: escalate
        description: >-
          A credit cannot exceed the total of the order it credits. Lower the
          credit amount, or split it across the orders it actually covers.
        # Stated in words below as `CreditWithinOrderTotalWithJudge`, and the
        # twin is what the demo guards on. It is the rule that needs a judge
        # able to read: `Order.total` is a number on record, so settling this
        # in words means looking it up. What argues for leaving the arithmetic
        # version here is that a query answers the comparison for nothing,
        # answers it the same way twice, and -- once there is an evaluator --
        # can answer it inside the transaction the write runs in, which is
        # where two concurrent credits stop being able to pass separately and
        # bust the total together.

      - name: CreditUnderReviewThreshold
        expression: amount <= 25
        on_violation: escalate
        description: >-
          A credit over $25 is above the self-service ceiling. A supervisor
          decides it.
        # The one rule here that a judge CAN settle, because the threshold is
        # read off the call's own `amount`. Stated in words below as
        # `CreditUnderReviewThresholdWithJudge` -- the same rule, down to the
        # description, differing only in who settles it -- and that twin is
        # what the demo guards on. When the expression evaluator lands, the
        # twin is the one to drop, which is why its name says how it is
        # settled and this one's does not.

      - name: OrderTotalMatchesLineItems
        expression: Order.total == SUM(LineItem.amount)
        on_violation: reject
        description: >-
          An order's total must equal the sum of its line items, with credits
          subtracted. Nobody can approve an order that does not add up.
        # No counterpart in words either, and out of reach of any judge, however
        # much it can read: this constrains the state the write leaves behind,
        # and guards are settled before the transaction opens. It wants to be
        # checked inside the transaction, or declared in the schema.

      # Rules stated in words, settled by a judge reading the attempted call
      # and, where the rule is about something on record, the record. These are
      # what `IssueCredit` guards on, and they carry all three consequences:
      # escalate, warn and reject.
      - name: CreditWithinOrderTotalWithJudge
        judgment: >-
          The credit amount requested must not exceed the total of the order
          it is applied to. The `order` argument of this call identifies that
          order, and the order's total is on record rather than stated in the
          arguments, so read it before answering. Read both as dollars.
        on_violation: escalate
        description: >-
          A credit cannot exceed the total of the order it credits. Lower the
          credit amount, or split it across the orders it actually covers.

      - name: CreditUnderReviewThresholdWithJudge
        judgment: >-
          The credit amount requested must not exceed 25 dollars, which is the
          self-service ceiling for this desk. Read the amount as dollars.
        on_violation: escalate
        description: >-
          A credit over $25 is above the self-service ceiling. A supervisor
          decides it.

      - name: CreditMemoNamesAServiceFailure
        judgment: >-
          The memo argument of this call must name a specific thing that went
          wrong on the order: a late delivery, a damaged item, a shipping
          charge applied in error. A memo saying only that the customer asked,
          or that the credit is goodwill, or giving no reason at all, names no
          failure and does not satisfy this rule.
        on_violation: warn
        description: >-
          Say in the credit memo what actually went wrong with the order.

      - name: CreditIsNotSplitToAvoidReview
        judgment: >-
          The credit requested must be the whole of what this order is owed,
          not one piece of a larger amount divided to stay under the 25-dollar
          self-service ceiling. A memo argument calling the credit a part, a
          half, an instalment, the first or second of several, or a remainder,
          or naming a total larger than the amount argument, does not satisfy
          this rule.
        on_violation: reject
        description: >-
          Raise this as a single credit for the full amount and send it for
          supervisor review.
