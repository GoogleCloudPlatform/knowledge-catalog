# Where the commerce model lives, and how its one action is carried out.
#
# Everything in this file is a physical fact: a table, a column, the DML. A
# profile may not add an entity, rename a field or change what anything means --
# the loader rejects that -- so reading this file tells you the whole of what is
# deployment-specific about the demo, and nothing about the business.
#
# If you are running against a different project, instance or database, the four
# names appear in `deployment_target` and in each `source` below, and nowhere
# else.
#
# The executor is here rather than in the model for the same reason the table
# names are: the same IssueCredit could be performed by an MCP tool against a
# different store, and that would be a second profile, not a second action.

version: "0.2.0.dev0/google"

semantic_model:
  - name: commerce
    deployment_target: //spanner.googleapis.com/projects/sqlgen-testing/instances/graph-unified-solution-demo/databases/semantic_agent_demo/propertyGraphs/commerce

    entities:
      - name: Customer
        source: //spanner.googleapis.com/projects/sqlgen-testing/instances/graph-unified-solution-demo/databases/semantic_agent_demo/tables/Customer
        fields:
          - {name: customerId, expression: customer_id}
          - {name: name, expression: name}
          - {name: email, expression: email}

      - name: Order
        source: //spanner.googleapis.com/projects/sqlgen-testing/instances/graph-unified-solution-demo/databases/semantic_agent_demo/tables/Orders
        fields:
          - {name: orderId, expression: order_id}
          - {name: customerId, expression: customer_id}
          - {name: placedOn, expression: placed_on}
          - {name: total, expression: total}
          - {name: status, expression: status}

      - name: LineItem
        source: //spanner.googleapis.com/projects/sqlgen-testing/instances/graph-unified-solution-demo/databases/semantic_agent_demo/tables/LineItem
        fields:
          - {name: lineItemId, expression: line_item_id}
          - {name: orderId, expression: order_id}
          - {name: type, expression: type}
          - {name: amount, expression: amount}
          - {name: memo, expression: memo}

    actions:
      - name: IssueCredit
        executor:
          sql:
            statements:
              # Physical column names, not the model's field names: these
              # statements are handed to Spanner as written. `@newLineItemKey`
              # is generated by the runtime because the action's `affects` says
              # this call creates a LineItem; naming it is how the new row's key
              # gets into the INSERT.
              - >-
                INSERT INTO LineItem (line_item_id, order_id, type, amount, memo)
                VALUES (@newLineItemKey, @order, 'credit', -@amount, @memo)
              # Recomputed from the lines, not adjusted by the credit amount.
              # Whatever the lines now say is what the total becomes, so the
              # order cannot stop adding up however this action is called -- and
              # there is no arithmetic for the agent to get wrong.
              - >-
                UPDATE Orders SET total = (
                  SELECT COALESCE(SUM(li.amount), 0)
                  FROM LineItem AS li
                  WHERE li.order_id = @order
                ) WHERE order_id = @order
