# The same commerce model, in AlloyDB.
#
# This is the whole of what it takes to move the demo to a different database.
# There is no second model, no second agent and no second set of tools: read
# this file beside commerce.profiles/spanner.yaml and the differences are a
# deployment target, three table names, one column name, and PostgreSQL in place
# of GoogleSQL in the two statements. Everything the business means is in
# commerce.yaml and is untouched.
#
# What each difference is:
#
#   * The deployment target names a DATABASE and stops there, where the Spanner
#     one ends in `/propertyGraphs/commerce`. AlloyDB has no property-graph DDL,
#     so there is no graph to deploy and `kcmd push` has nothing to do under this
#     profile -- it will say so. The model still RUNS here, which is what a
#     deployment target is for on this side.
#
#   * The tables are `customer`, `purchase_order` and `order_line`, because that
#     is what somebody who only ever used PostgreSQL would have called them. The
#     model calls the entities Customer, Order and LineItem in both deployments.
#
#   * `Order.total` is bound to `order_total` here and to `total` on Spanner. One
#     renamed column is enough to show that a field is a logical name rather than
#     a column with a nicer spelling.
#
#   * The statements are PostgreSQL. The runtime never rewrites SQL a profile
#     author wrote -- it is handed to the database as typed -- so a profile is
#     where dialect belongs. The parameters are still `@name`, because that is
#     one syntax across every backend; the AlloyDB client rewrites them to `$1`,
#     `$2` on the way out.
#
# If you are running against a different project, region, cluster, instance or
# database, those names appear in `deployment_target` and in each `source` below,
# and nowhere else.

version: "0.2.0.dev0/google"

semantic_model:
  - name: commerce
    deployment_target: //alloydb.googleapis.com/projects/my-project/locations/us-central1/clusters/my-cluster/instances/my-instance/databases/semantic_agent_demo

    entities:
      - name: Customer
        source: //alloydb.googleapis.com/projects/my-project/locations/us-central1/clusters/my-cluster/instances/my-instance/databases/semantic_agent_demo/tables/customer
        fields:
          - {name: customerId, expression: customer_id}
          - {name: name, expression: name}
          - {name: email, expression: email}

      - name: Order
        source: //alloydb.googleapis.com/projects/my-project/locations/us-central1/clusters/my-cluster/instances/my-instance/databases/semantic_agent_demo/tables/purchase_order
        fields:
          - {name: orderId, expression: order_id}
          - {name: customerId, expression: customer_id}
          - {name: placedOn, expression: placed_on}
          - {name: total, expression: order_total}
          - {name: status, expression: status}

      - name: LineItem
        source: //alloydb.googleapis.com/projects/my-project/locations/us-central1/clusters/my-cluster/instances/my-instance/databases/semantic_agent_demo/tables/order_line
        fields:
          - {name: lineItemId, expression: line_item_id}
          - {name: orderId, expression: order_id}
          - {name: type, expression: type}
          - {name: amount, expression: amount}
          - {name: memo, expression: memo}

    actions:
      - name: IssueCredit
        executor:
          sql:
            statements:
              # Physical column names, not the model's field names, exactly as
              # on the Spanner side. `@newLineItemKey` is generated by the
              # runtime because the action's `affects` says this call creates a
              # LineItem.
              - >-
                INSERT INTO order_line (line_item_id, order_id, type, amount, memo)
                VALUES (@newLineItemKey, @order, 'credit', -@amount, @memo)
              # Recomputed from the lines, not adjusted by the credit amount --
              # the same reasoning as on Spanner, and the same shape of
              # statement. What differs is the table and column names and the
              # dialect they are written in.
              - >-
                UPDATE purchase_order SET order_total = (
                  SELECT COALESCE(SUM(li.amount), 0)
                  FROM order_line AS li
                  WHERE li.order_id = @order
                ) WHERE order_id = @order
