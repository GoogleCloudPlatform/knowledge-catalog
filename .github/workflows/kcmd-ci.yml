name: kcmd CI

on:
  pull_request:
    paths:
      - 'toolbox/mdcode/**'
      - '.github/workflows/kcmd-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'toolbox/mdcode/**'
      - '.github/workflows/kcmd-ci.yml'

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toolbox/mdcode
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: toolbox/mdcode/package-lock.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - name: Install, compile, build, and test
        run: |
          npm ci
          npm run compile
          npm run build
          CLOUDSDK_CONFIG="$(mktemp -d)" npm test
